<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отчёт по взносам — Звездочки</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
  min-height: 100vh; 
  background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #2d1b4e 100%); 
  color: #e8e8ff; 
  padding: 20px; 
  overflow-x: hidden; 
  position: relative; 
}

/* Звёздный фон */
body::before { 
  content: ''; 
  position: fixed; 
  top: 0; left: 0; right: 0; bottom: 0; 
  background-image: 
    radial-gradient(2px 2px at 20% 30%, white, transparent),
    radial-gradient(2px 2px at 60% 70%, white, transparent),
    radial-gradient(1px 1px at 50% 50%, white, transparent),
    radial-gradient(1px 1px at 80% 10%, white, transparent),
    radial-gradient(2px 2px at 90% 60%, white, transparent),
    radial-gradient(1px 1px at 33% 80%, white, transparent);
  background-size: 200% 200%;
  animation: stars 20s linear infinite;
  opacity: 0.6;
  pointer-events: none;
  z-index: 0;
}
@keyframes stars { 0% { background-position: 0% 0%; } 100% { background-position: 200% 200%; } }

/* Экран входа */
.login-screen { 
  display: flex; align-items: center; justify-content: center; 
  min-height: 100vh; padding: 20px; position: relative; z-index: 1; 
}
.login-box { 
  background: rgba(255, 255, 255, 0.05); 
  backdrop-filter: blur(20px); 
  -webkit-backdrop-filter: blur(20px); 
  border: 1px solid rgba(255, 255, 255, 0.15); 
  padding: 40px 30px; 
  border-radius: 24px; 
  max-width: 400px; 
  width: 100%; 
  text-align: center; 
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); 
}
.login-box h2 { 
  color: #00e5ff; 
  margin-bottom: 10px; 
  text-shadow: 0 0 20px rgba(0, 229, 255, 0.5); 
}
.login-box p { color: rgba(255, 255, 255, 0.7); margin-bottom: 20px; }
.login-box input { 
  width: 100%; 
  padding: 14px; 
  background: rgba(0, 0, 0, 0.3); 
  border: 1px solid rgba(255, 255, 255, 0.2); 
  border-radius: 12px; 
  color: white; 
  font-size: 1em; 
  margin-bottom: 12px; 
  text-align: center; 
}
.login-box input::placeholder { color: rgba(255, 255, 255, 0.4); }
.login-box input:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }
.login-box button { 
  width: 100%; 
  padding: 14px; 
  background: linear-gradient(135deg, #00e5ff, #7b61ff); 
  color: white; 
  border: none; 
  border-radius: 12px; 
  font-size: 1em; 
  font-weight: 700; 
  cursor: pointer; 
  box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4); 
}
.login-box button:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0, 229, 255, 0.6); }
.login-error { color: #ff3d71; font-size: 0.9em; margin-top: 10px; display: none; }

/* Основной контейнер */
.container { 
  max-width: 900px; 
  margin: 0 auto; 
  position: relative; 
  z-index: 1; 
}

/* Шапка */
.header { 
  text-align: center; 
  padding: 30px 20px; 
  background: rgba(255, 255, 255, 0.03); 
  backdrop-filter: blur(20px); 
  -webkit-backdrop-filter: blur(20px); 
  border: 1px solid rgba(255, 255, 255, 0.1); 
  border-radius: 24px; 
  margin-bottom: 24px; 
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.header-icon { font-size: 3em; margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.5)); }
.header h1 { 
  font-size: 1.8em; 
  font-weight: 800; 
  background: linear-gradient(135deg, #00e5ff 0%, #ff9100 100%); 
  -webkit-background-clip: text; 
  -webkit-text-fill-color: transparent; 
  background-clip: text; 
  margin-bottom: 8px; 
}
.header h2 { font-size: 1.2em; color: #fff; font-weight: 600; margin-bottom: 4px; }
.header .subtitle { font-size: 0.9em; color: #ff9100; font-weight: 700; letter-spacing: 1px; }

/* Сетка индикаторов (2x2 на мобильных, 4 в ряд на ПК) */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
@media (min-width: 768px) {
  .summary-grid { grid-template-columns: repeat(4, 1fr); }
}

.summary-card { 
  background: rgba(255, 255, 255, 0.05); 
  backdrop-filter: blur(20px); 
  -webkit-backdrop-filter: blur(20px); 
  border: 1px solid rgba(255, 255, 255, 0.1); 
  border-radius: 16px; 
  padding: 18px 12px; 
  text-align: center; 
  position: relative; 
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); 
}
.summary-card::before { 
  content: '◈'; 
  position: absolute; 
  top: 8px; 
  left: 10px; 
  font-size: 0.7em; 
  opacity: 0.5; 
}
.summary-card.blue { border-color: #7b61ff; box-shadow: 0 0 20px rgba(123, 97, 255, 0.2); }
.summary-card.green { border-color: #00ff88; box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }
.summary-card.orange { border-color: #ff9100; box-shadow: 0 0 20px rgba(255, 145, 0, 0.2); }
.summary-card.red { border-color: #ff3d71; box-shadow: 0 0 20px rgba(255, 61, 113, 0.2); }

.summary-label { 
  font-size: 0.65em; 
  text-transform: uppercase; 
  letter-spacing: 1px; 
  margin-bottom: 6px; 
  opacity: 0.8; 
  font-weight: 600;
}
.summary-card.blue .summary-label { color: #7b61ff; }
.summary-card.green .summary-label { color: #00ff88; }
.summary-card.orange .summary-label { color: #ff9100; }
.summary-card.red .summary-label { color: #ff3d71; }

.summary-value { 
  font-size: 1.5em; 
  font-weight: 800; 
  font-family: 'Courier New', monospace;
  text-shadow: 0 0 10px currentColor; 
}
.summary-card.blue .summary-value { color: #7b61ff; }
.summary-card.green .summary-value { color: #00ff88; }
.summary-card.orange .summary-value { color: #ff9100; }
.summary-card.red .summary-value { color: #ff3d71; }

/* Прогресс-бар */
.progress-section { 
  background: rgba(255, 255, 255, 0.03); 
  backdrop-filter: blur(20px); 
  -webkit-backdrop-filter: blur(20px); 
  border: 1px solid rgba(255, 255, 255, 0.1); 
  border-radius: 16px; 
  padding: 20px; 
  margin-bottom: 24px; 
}
.progress-title { font-size: 1.1em; font-weight: 700; margin-bottom: 12px; color: #fff; text-align: center; }
.progress-bar { 
  width: 100%; 
  height: 20px; 
  background: rgba(0, 0, 0, 0.3); 
  border-radius: 10px; 
  overflow: hidden; 
  position: relative; 
}
.progress-fill { 
  height: 100%; 
  background: linear-gradient(90deg, #ff3d71 0%, #ff9100 50%, #00ff88 100%); 
  border-radius: 10px; 
  transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); 
  box-shadow: 0 0 15px rgba(0, 255, 136, 0.5); 
}
.progress-percent { 
  text-align: center; 
  margin-top: 8px; 
  font-size: 1.2em; 
  font-weight: 800; 
  color: #00e5ff; 
  font-family: 'Courier New', monospace;
}

/* Секции */
.section { 
  background: rgba(255, 255, 255, 0.03); 
  backdrop-filter: blur(20px); 
  -webkit-backdrop-filter: blur(20px); 
  border: 1px solid rgba(255, 255, 255, 0.1); 
  border-radius: 16px; 
  padding: 20px; 
  margin-bottom: 24px; 
}
.section-title { 
  font-size: 1.1em; 
  font-weight: 700; 
  margin-bottom: 16px; 
  display: flex; 
  align-items: center; 
  gap: 8px; 
  padding-bottom: 8px; 
  border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
  color: #fff;
}

/* Таблица */
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th { 
  background: rgba(0, 229, 255, 0.1); 
  color: #00e5ff; 
  padding: 10px; 
  text-align: left; 
  font-size: 0.75em; 
  text-transform: uppercase; 
  letter-spacing: 1px; 
  font-weight: 700; 
}
td { padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.9em; }
.status-paid { 
  color: #00ff88; 
  font-weight: 700; 
  background: rgba(0, 255, 136, 0.1); 
  padding: 4px 8px; 
  border-radius: 6px; 
  display: inline-block; 
  font-size: 0.8em; 
}
.status-unpaid { 
  color: #ff9100; 
  font-weight: 700; 
  background: rgba(255, 145, 0, 0.1); 
  padding: 4px 8px; 
  border-radius: 6px; 
  display: inline-block; 
  font-size: 0.8em; 
}
.amount { font-weight: 600; text-align: right; font-family: 'Courier New', monospace; }

/* Списки */
.lists-grid { 
  display: grid; 
  grid-template-columns: 1fr; 
  gap: 16px; 
}
@media (min-width: 768px) {
  .lists-grid { grid-template-columns: 1fr 1fr; }
}

.list-card { 
  background: rgba(255, 255, 255, 0.03); 
  border: 1px solid rgba(255, 255, 255, 0.1); 
  border-radius: 16px; 
  padding: 16px; 
}
.list-card.paid { border-left: 4px solid #00ff88; }
.list-card.unpaid { border-left: 4px solid #ff9100; }

.list-title { 
  font-size: 1em; 
  font-weight: 700; 
  margin-bottom: 12px; 
  display: flex; 
  align-items: center; 
  gap: 8px; 
}
.list-card.paid .list-title { color: #00ff88; }
.list-card.unpaid .list-title { color: #ff9100; }

.person { 
  padding: 8px 0; 
  border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  font-size: 0.9em; 
}
.person:last-child { border-bottom: none; }
.person-name { font-weight: 500; color: #e8e8ff; }
.person-amount { font-weight: 700; color: rgba(255, 255, 255, 0.7); font-family: 'Courier New', monospace; }

/* Комментарий */
.comment-box { 
  background: rgba(255, 145, 0, 0.08); 
  border: 1px solid rgba(255, 145, 0, 0.3); 
  border-radius: 12px; 
  padding: 16px; 
  margin-bottom: 24px; 
  position: relative; 
}
.comment-box::before { 
  content: '📡'; 
  position: absolute; 
  top: -12px; 
  left: 15px; 
  font-size: 1.2em; 
  background: #1a1a3e; 
  padding: 0 6px; 
  border-radius: 50%; 
}
.comment-text { color: rgba(255, 255, 255, 0.9); line-height: 1.5; font-style: italic; padding-left: 8px; }

/* Футер */
.footer { 
  text-align: center; 
  padding: 20px; 
  color: rgba(255, 255, 255, 0.4); 
  font-size: 0.8em; 
  margin-top: 20px; 
  border-top: 1px solid rgba(0, 229, 255, 0.2);
  letter-spacing: 1px;
}
.footer strong { color: #00e5ff; }

/* Кнопка печати */
.print-button { 
  position: fixed; 
  top: 20px; 
  right: 20px; 
  background: linear-gradient(135deg, #00e5ff, #7b61ff); 
  color: white; 
  border: none; 
  padding: 12px 24px; 
  border-radius: 12px; 
  font-size: 0.9em; 
  font-weight: 700; 
  cursor: pointer; 
  box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4); 
  z-index: 1000; 
  transition: all 0.3s ease; 
}
.print-button:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0, 229, 255, 0.6); }

/* Адаптив */
@media (max-width: 768px) { 
  body { padding: 12px; } 
  .header { padding: 20px 16px; } 
  .header h1 { font-size: 1.4em; } 
  .print-button { top: 10px; right: 10px; padding: 10px 16px; font-size: 0.8em; } 
  th, td { padding: 8px; font-size: 0.85em; }
}

/* ПЕЧАТЬ — Сохранение тёмного фона */
@media print {
  * { 
    -webkit-print-color-adjust: exact !important; 
    print-color-adjust: exact !important; 
    color-adjust: exact !important; 
  }
  body { 
    background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #2d1b4e 100%) !important; 
    padding: 10mm; 
  }
  body::before { display: none; }
  .container { max-width: 100%; }
  .print-button { display: none; }
  .summary-card, .section, .list-card, .progress-section, .comment-box, .header { 
    page-break-inside: avoid; 
  }
}
</style>
</head>
<body>

<!-- Экран входа -->
<div id="loginView" class="login-screen">
    <div class="login-box">
        <div style="font-size:3em; margin-bottom:12px;">🚀</div>
        <h2>Отчёт по взносам</h2>
        <p>Введите пароль для доступа</p>
        <input type="password" id="pwdInput" placeholder="Пароль" onkeypress="if(event.key==='Enter')tryLogin()">
        <button onclick="tryLogin()">🔓 Войти</button>
        <div class="login-error" id="loginError">❌ Неверный пароль</div>
    </div>
</div>

<!-- Отчёт -->
<div id="reportView" style="display:none;">
    <button class="print-button" onclick="window.print()">🖨️ Печать / PDF</button>
    <div class="container">
        <div class="header">
            <div class="header-icon">💰</div>
            <h1>Отчёт по взносам</h1>
            <h2 id="monthName">—</h2>
            <div class="subtitle" id="groupInfo"></div>
        </div>
        <div id="content"></div>
        <div class="footer">
            <p><strong>Родительский комитет «Звездочки»</strong></p>
            <p style="margin-top:8px;">Документ сформирован: <span id="generatedDate"></span></p>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyDKi0CkhA5jPr7fNkPerItkLDKNLMcLpMw",
    authDomain: "parent-budget-70c5a.firebaseapp.com",
    projectId: "parent-budget-70c5a",
    storageBucket: "parent-budget-70c5a.firebasestorage.app",
    messagingSenderId: "214835144455",
    appId: "1:214835144455:web:b1d91914f16c66004507a2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const urlParams = new URLSearchParams(window.location.search);
const reportId = urlParams.get('id');
let reportData = null;

function formatMoney(n) { return Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 }); }
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, function(c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

async function tryLogin() {
    const pwd = document.getElementById('pwdInput').value.trim();
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    
    if (!reportId) {
        errEl.textContent = '❌ Ссылка недействительна';
        errEl.style.display = 'block';
        return;
    }
    
    try {
        const doc = await db.collection('contributions_reports').doc(reportId).get();
        if (!doc.exists) {
            errEl.textContent = '❌ Отчёт не найден';
            errEl.style.display = 'block';
            return;
        }
        reportData = doc.data();
        if (reportData.password !== pwd) {
            errEl.textContent = '❌ Неверный пароль';
            errEl.style.display = 'block';
            return;
        }
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('reportView').style.display = 'block';
        renderReport();
    } catch(e) {
        errEl.textContent = '❌ Ошибка: ' + e.message;
        errEl.style.display = 'block';
    }
}

function renderReport() {
    const r = reportData;
    const g = r.groupInfo || {};
    document.getElementById('monthName').textContent = r.monthName || '—';
    document.getElementById('groupInfo').textContent = 'Группа №' + g.number + ' «' + g.name + '»';
    document.getElementById('generatedDate').textContent = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    
    const students = (r.students || []).filter(s => s.name);
    let totalExpected = 0, totalPaid = 0, paidCount = 0;
    students.forEach(s => {
        const amount = Number(s.amount || 0);
        totalExpected += amount;
        if (s.paid) { paidCount++; totalPaid += amount; }
    });
    const remaining = totalExpected - totalPaid;
    const percent = totalExpected > 0 ? Math.round((totalPaid / totalExpected) * 100) : 0;
    
    let html = '';
    
    // Комментарий
    if (r.comment) {
        html += '<div class="comment-box"><div class="comment-text">' + escapeHtml(r.comment) + '</div></div>';
    }
    
    // 4 карточки-показателя (сетка 2x2 на мобильных)
    html += '<div class="summary-grid">';
    html += '<div class="summary-card blue"><div class="summary-label">Всего человек</div><div class="summary-value">' + students.length + '</div></div>';
    html += '<div class="summary-card green"><div class="summary-label">Участвовали</div><div class="summary-value">' + paidCount + '</div></div>';
    html += '<div class="summary-card orange"><div class="summary-label">Ожидалось</div><div class="summary-value">' + formatMoney(totalExpected) + ' ₽</div></div>';
    html += '<div class="summary-card red"><div class="summary-label">Осталось</div><div class="summary-value">' + formatMoney(remaining) + ' ₽</div></div>';
    html += '</div>';
    
    // Прогресс-бар
    html += '<div class="progress-section">';
    html += '<div class="progress-title">📊 Прогресс сбора</div>';
    html += '<div class="progress-bar"><div class="progress-fill" style="width: ' + percent + '%;"></div></div>';
    html += '<div class="progress-percent">' + percent + '%</div>';
    html += '</div>';
    
    // Таблица всех участников
    html += '<div class="section"><div class="section-title">📋 Список участников</div>';
    if (students.length === 0) {
        html += '<div style="text-align:center; color:rgba(255,255,255,0.5); padding:30px;">Нет данных</div>';
    } else {
        html += '<div style="overflow-x:auto;"><table><thead><tr><th style="width:40px;">№</th><th>ФИО ребёнка</th><th style="width:100px; text-align:right;">Сумма</th><th style="width:110px; text-align:center;">Статус</th></tr></thead><tbody>';
        students.forEach((s, i) => {
            // Мягкие формулировки
            const statusText = s.paid ? '✔ Участвовал' : '⏳ Ожидается';
            const statusClass = s.paid ? 'status-paid' : 'status-unpaid';
            html += '<tr>';
            html += '<td>' + (i + 1) + '</td>';
            html += '<td style="font-weight:500;">' + escapeHtml(s.name) + '</td>';
            html += '<td class="amount">' + (s.amount ? formatMoney(s.amount) + ' ₽' : '—') + '</td>';
            html += '<td style="text-align:center;"><span class="' + statusClass + '">' + statusText + '</span></td>';
            html += '</tr>';
        });
        html += '<tr style="background:rgba(0, 229, 255, 0.1); font-weight:700; border-top:2px solid rgba(0, 229, 255, 0.3);">';
        html += '<td colspan="2">ИТОГО: участвовали ' + paidCount + ' из ' + students.length + '</td>';
        html += '<td class="amount" style="color:#00e5ff;">' + formatMoney(totalPaid) + ' ₽</td>';
        html += '<td style="text-align:center;"><small style="color:rgba(255,255,255,0.6);">из ' + formatMoney(totalExpected) + ' ₽</small></td></tr>';
        html += '</tbody></table></div>';
    }
    html += '</div>';
    
    // Два списка: Участвовали / Не участвовали
    const paidList = students.filter(s => s.paid);
    const unpaidList = students.filter(s => !s.paid);
    
    html += '<div class="lists-grid">';
    
    // Список участвовавших
    html += '<div class="list-card paid">';
    html += '<div class="list-title">✅ Участвовали в сборе <span style="background:rgba(0,255,136,0.1); padding:2px 8px; border-radius:8px; font-size:0.8em;">' + paidList.length + '</span></div>';
    if (paidList.length === 0) {
        html += '<div style="color:rgba(255,255,255,0.5); font-size:0.9em; text-align:center; padding:10px;">Пока никто не участвовал</div>';
    } else {
        paidList.forEach(s => {
            html += '<div class="person"><span class="person-name">✔ ' + escapeHtml(s.name) + '</span><span class="person-amount">' + (s.amount ? formatMoney(s.amount) + ' ₽' : '') + '</span></div>';
        });
    }
    html += '</div>';
    
    // Список не участвовавших
    html += '<div class="list-card unpaid">';
    html += '<div class="list-title">⏳ Не участвовали в сборе <span style="background:rgba(255,145,0,0.1); padding:2px 8px; border-radius:8px; font-size:0.8em;">' + unpaidList.length + '</span></div>';
    if (unpaidList.length === 0) {
        html += '<div style="color:rgba(255,255,255,0.5); font-size:0.9em; text-align:center; padding:10px;">🎉 Все участвовали! Спасибо!</div>';
    } else {
        unpaidList.forEach(s => {
            html += '<div class="person"><span class="person-name">⏳ ' + escapeHtml(s.name) + '</span><span class="person-amount">' + (s.amount ? formatMoney(s.amount) + ' ₽' : '') + '</span></div>';
        });
    }
    html += '</div>';
    
    html += '</div>';
    
    document.getElementById('content').innerHTML = html;
}
</script>
</body>
