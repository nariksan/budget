<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Космическая сводка</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #2d1b4e 100%); color: #e8e8ff; padding: 20px; overflow-x: hidden; position: relative; }
body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: radial-gradient(2px 2px at 20% 30%, white, transparent), radial-gradient(2px 2px at 60% 70%, white, transparent), radial-gradient(1px 1px at 50% 50%, white, transparent), radial-gradient(1px 1px at 80% 10%, white, transparent), radial-gradient(2px 2px at 90% 60%, white, transparent), radial-gradient(1px 1px at 33% 80%, white, transparent), radial-gradient(1px 1px at 15% 90%, white, transparent), radial-gradient(2px 2px at 70% 40%, white, transparent); background-size: 200% 200%; animation: stars 20s linear infinite; opacity: 0.6; pointer-events: none; z-index: 0; }
@keyframes stars { 0% { background-position: 0% 0%; } 100% { background-position: 200% 200%; } }
.login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; position: relative; z-index: 1; }
.login-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 40px 30px; border-radius: 24px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
.login-box h2 { color: #00e5ff; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0, 229, 255, 0.5); }
.login-box p { color: rgba(255, 255, 255, 0.7); margin-bottom: 20px; }
.login-box input { width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; color: white; font-size: 1em; margin-bottom: 12px; text-align: center; }
.login-box input::placeholder { color: rgba(255, 255, 255, 0.4); }
.login-box input:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }
.login-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, #00e5ff, #7b61ff); color: white; border: none; border-radius: 12px; font-size: 1em; font-weight: 700; cursor: pointer; box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4); }
.login-box button:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0, 229, 255, 0.6); }
.login-error { color: #ff3d71; font-size: 0.9em; margin-top: 10px; display: none; }
.container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
.header { text-align: center; padding: 40px 30px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; margin-bottom: 24px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); position: relative; overflow: hidden; }
.header::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(0, 229, 255, 0.1) 0%, transparent 70%); animation: glow 8s ease-in-out infinite; }
@keyframes glow { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(10%, 10%); } }
.header-icon { font-size: 3.5em; margin-bottom: 12px; filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.5)); position: relative; z-index: 1; }
.header h1 { font-size: 2em; font-weight: 800; background: linear-gradient(135deg, #00e5ff 0%, #ff9100 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; position: relative; z-index: 1; }
.header h2 { font-size: 1.2em; color: rgba(255, 255, 255, 0.85); font-weight: 500; position: relative; z-index: 1; }
.header .subtitle { font-size: 0.9em; color: rgba(255, 255, 255, 0.6); margin-top: 8px; position: relative; z-index: 1; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 24px 20px; text-align: center; position: relative; overflow: hidden; transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
.stat-card:hover { transform: translateY(-4px); border-color: rgba(0, 229, 255, 0.4); }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--accent-color, #00e5ff), transparent); }
.stat-card.green { --accent-color: #00e5ff; }
.stat-card.orange { --accent-color: #ff9100; }
.stat-card.red { --accent-color: #ff3d71; }
.stat-card.blue { --accent-color: #7b61ff; }
.stat-icon { font-size: 2em; margin-bottom: 8px; filter: drop-shadow(0 0 10px var(--accent-color)); }
.stat-label { font-size: 0.75em; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255, 255, 255, 0.6); margin-bottom: 8px; font-weight: 600; }
.stat-value { font-size: 1.8em; font-weight: 800; color: var(--accent-color, #fff); text-shadow: 0 0 20px var(--accent-color); }
.stat-sub { font-size: 0.8em; color: rgba(255, 255, 255, 0.5); margin-top: 6px; }
.progress-section { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
.progress-title { font-size: 1.2em; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; color: #fff; }
.progress-info { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9em; flex-wrap: wrap; gap: 8px; }
.progress-collected { color: #00e5ff; font-weight: 700; }
.progress-remaining { color: #ff9100; font-weight: 700; }
.progress-bar { width: 100%; height: 24px; background: rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; position: relative; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3); }
.progress-fill { height: 100%; background: linear-gradient(90deg, #00e5ff 0%, #7b61ff 50%, #ff9100 100%); border-radius: 12px; position: relative; transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 20px rgba(0, 229, 255, 0.6); animation: progress-shine 2s ease-in-out infinite; }
@keyframes progress-shine { 0%, 100% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.6); } 50% { box-shadow: 0 0 30px rgba(0, 229, 255, 0.9), 0 0 40px rgba(123, 97, 255, 0.5); } }
.progress-fill::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); animation: shine 2s linear infinite; }
@keyframes shine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.progress-percent { text-align: center; margin-top: 10px; font-size: 1.3em; font-weight: 800; background: linear-gradient(135deg, #00e5ff, #ff9100); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.section { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
.section-title { font-size: 1.3em; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 2px solid rgba(255, 255, 255, 0.1); color: #fff; }
.section-title .icon { font-size: 1.2em; filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.5)); }
table { width: 100%; border-collapse: collapse; margin-top: 12px; }
th { background: rgba(0, 229, 255, 0.1); color: #00e5ff; padding: 12px; text-align: left; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; border-bottom: 1px solid rgba(0, 229, 255, 0.2); }
td { padding: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.95em; }
tr:hover { background: rgba(255, 255, 255, 0.03); }
.amount { font-weight: 700; text-align: right; color: #fff; }
.status-paid { color: #00e5ff; font-weight: 700; padding: 4px 12px; border-radius: 12px; background: rgba(0, 229, 255, 0.15); border: 1px solid rgba(0, 229, 255, 0.3); display: inline-block; font-size: 0.85em; }
.status-unpaid { color: #ff9100; font-weight: 700; padding: 4px 12px; border-radius: 12px; background: rgba(255, 145, 0, 0.15); border: 1px solid rgba(255, 145, 0, 0.3); display: inline-block; font-size: 0.85em; }
.totals-row { background: rgba(0, 229, 255, 0.1) !important; font-weight: 700; border-top: 2px solid rgba(0, 229, 255, 0.3); }
.totals-row td { padding: 16px 12px; color: #00e5ff; }
.expense-amount { color: #ff3d71 !important; }
.lists-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
@media (max-width: 768px) { .lists-grid { grid-template-columns: 1fr; } }
.list-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
.list-card.paid { border-left: 4px solid #00e5ff; box-shadow: 0 4px 20px rgba(0, 229, 255, 0.1); }
.list-card.unpaid { border-left: 4px solid #ff9100; box-shadow: 0 4px 20px rgba(255, 145, 0, 0.1); }
.list-title { font-size: 1.1em; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.list-card.paid .list-title { color: #00e5ff; }
.list-card.unpaid .list-title { color: #ff9100; }
.list-count { background: rgba(255, 255, 255, 0.1); padding: 2px 10px; border-radius: 10px; font-size: 0.85em; }
.person { padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; font-size: 0.95em; }
.person:last-child { border-bottom: none; }
.person-name { font-weight: 500; color: #e8e8ff; }
.person-amount { font-weight: 700; color: rgba(255, 255, 255, 0.7); font-family: 'Courier New', monospace; }
.comment-box { background: linear-gradient(135deg, rgba(255, 145, 0, 0.1), rgba(123, 97, 255, 0.1)); border: 1px solid rgba(255, 145, 0, 0.3); border-radius: 16px; padding: 20px; margin-bottom: 24px; position: relative; }
.comment-box::before { content: '💬'; position: absolute; top: -15px; left: 20px; font-size: 1.5em; background: #1a1a3e; padding: 0 8px; border-radius: 50%; }
.comment-text { color: rgba(255, 255, 255, 0.85); line-height: 1.6; font-style: italic; padding-left: 8px; }
.footer { text-align: center; padding: 24px; color: rgba(255, 255, 255, 0.5); font-size: 0.85em; margin-top: 20px; }
.footer strong { color: #00e5ff; }
.print-button { position: fixed; top: 20px; right: 20px; background: linear-gradient(135deg, #00e5ff, #7b61ff); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-size: 0.95em; font-weight: 700; cursor: pointer; box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4); z-index: 1000; transition: all 0.3s ease; }
.print-button:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0, 229, 255, 0.6); }
@media (max-width: 768px) { body { padding: 12px; } .header { padding: 24px 16px; } .header h1 { font-size: 1.5em; } .header h2 { font-size: 1em; } .stat-value { font-size: 1.4em; } .section { padding: 16px; } .print-button { top: 10px; right: 10px; padding: 10px 16px; font-size: 0.85em; } }
@media print { body { background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #2d1b4e 100%) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; } body::before { display: none; } .print-button { display: none; } .stat-card, .section, .list-card, .progress-section, .comment-box, .header { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body>

<div id="loginView" class="login-screen">
    <div class="login-box">
        <div style="font-size:3em; margin-bottom:12px; filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.5));">🌌</div>
        <h2>Космическая сводка</h2>
        <p>Введите пароль для доступа</p>
        <input type="password" id="pwdInput" placeholder="Пароль" onkeypress="if(event.key==='Enter')tryLogin()">
        <button onclick="tryLogin()">🔓 Войти</button>
        <div class="login-error" id="loginError">❌ Неверный пароль</div>
    </div>
</div>

<div id="reportView" style="display:none;">
    <button class="print-button" onclick="window.print()">🖨️ Распечатать / PDF</button>
    <div class="container">
        <div class="header">
            <div class="header-icon">🌌</div>
            <h1 id="reportTitle">Финансовая сводка</h1>
            <h2 id="monthName">—</h2>
            <div class="subtitle" id="groupInfo"></div>
        </div>
        <div id="content"></div>
        <div class="footer">
            <p><strong>Родительский комитет</strong> · <span id="footerGroup"></span></p>
            <p style="margin-top:8px;">Документ сформирован: <span id="generatedDate"></span></p>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyDKi0CkhA5jPr7fNkPerItkLDKNLMcLpMw",
    authDomain: "parent-budget-70c5a.firebaseapp.com",
    projectId: "parent-budget-70c5a",
    storageBucket: "parent-budget-70c5a.firebasestorage.app",
    messagingSenderId: "214835144455",
    appId: "1:214835144455:web:b1d91914f16c66004507a2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const urlParams = new URLSearchParams(window.location.search);
const reportId = urlParams.get('id');
let reportData = null;

function formatMoney(n) { return Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 }); }
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, function(c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

async function tryLogin() {
    const pwd = document.getElementById('pwdInput').value.trim();
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    if (!reportId) { errEl.textContent = '❌ Ссылка недействительна'; errEl.style.display = 'block'; return; }
    try {
        const doc = await db.collection('cosmic_reports').doc(reportId).get();
        if (!doc.exists) { errEl.textContent = '❌ Отчёт не найден'; errEl.style.display = 'block'; return; }
        reportData = doc.data();
        if (reportData.password !== pwd) { errEl.textContent = '❌ Неверный пароль'; errEl.style.display = 'block'; return; }
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('reportView').style.display = 'block';
        renderReport();
    } catch(e) { errEl.textContent = '❌ Ошибка: ' + e.message; errEl.style.display = 'block'; }
}

function renderReport() {
    const r = reportData;
    const g = r.groupInfo || {};
    const m = r.monthData;
    if (!m) { document.getElementById('content').innerHTML = '<div style="text-align:center; padding:40px; color:#ff3d71;">❌ Нет данных месяца</div>'; return; }
    document.getElementById('reportTitle').textContent = r.title || 'Финансовая сводка';
    document.getElementById('monthName').textContent = m.name || '—';
    document.getElementById('groupInfo').textContent = 'Группа №' + g.number + ' «' + g.name + '»';
    document.getElementById('footerGroup').textContent = 'Группа №' + g.number + ' «' + g.name + '»';
    document.getElementById('generatedDate').textContent = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    
    const students = (m.students || []).filter(s => s.name);
    const expenses = m.expenses || [];
    let totalExpected = 0, totalPaid = 0, paidCount = 0;
    students.forEach(s => { const amount = Number(s.amount || 0); totalExpected += amount; if (s.paid) { paidCount++; totalPaid += amount; } });
    const totalExpense = expenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
    const prevBal = Number(m.prevBalance || 0);
    const addIncome = Number(m.additionalIncome || 0);
    const balance = prevBal + totalPaid + addIncome - totalExpense;
    const remaining = totalExpected - totalPaid;
    const percent = totalExpected > 0 ? Math.round((totalPaid / totalExpected) * 100) : 0;
    
    let html = '';
    if (r.comment) html += '<div class="comment-box"><div class="comment-text">' + escapeHtml(r.comment) + '</div></div>';
    
    html += '<div class="stats-grid">';
    html += '<div class="stat-card green"><div class="stat-icon">💰</div><div class="stat-label">Остаток средств</div><div class="stat-value">' + formatMoney(balance) + ' ₽</div><div class="stat-sub">на конец месяца</div></div>';
    html += '<div class="stat-card blue"><div class="stat-icon">📥</div><div class="stat-label">Сбор взносов</div><div class="stat-value">' + formatMoney(totalPaid) + ' ₽</div><div class="stat-sub">из ' + formatMoney(totalExpected) + ' ₽</div></div>';
    html += '<div class="stat-card red"><div class="stat-icon">💸</div><div class="stat-label">Расходы месяца</div><div class="stat-value">' + formatMoney(totalExpense) + ' ₽</div><div class="stat-sub">' + expenses.length + ' позиций</div></div>';
    html += '<div class="stat-card orange"><div class="stat-icon">👥</div><div class="stat-label">Сдали / Всего</div><div class="stat-value">' + paidCount + ' / ' + students.length + '</div><div class="stat-sub">' + percent + '% родителей</div></div>';
    html += '</div>';
    
    html += '<div class="progress-section">';
    html += '<div class="progress-title"><span class="icon">📊</span><span>Прогресс сбора</span></div>';
    html += '<div class="progress-info"><span class="progress-collected">Собрано: ' + formatMoney(totalPaid) + ' ₽</span><span class="progress-remaining">Осталось: ' + formatMoney(remaining > 0 ? remaining : 0) + ' ₽</span></div>';
    html += '<div class="progress-bar"><div class="progress-fill" style="width: ' + percent + '%;"></div></div>';
    html += '<div class="progress-percent">' + percent + '%</div>';
    html += '</div>';
    
    html += '<div class="section"><div class="section-title"><span class="icon">📋</span><span>Список взносов</span></div>';
    if (students.length === 0) { html += '<div style="text-align:center; padding:30px; color:rgba(255,255,255,0.5);">Нет данных</div>'; }
    else {
        html += '<div style="overflow-x:auto;"><table><thead><tr><th style="width:40px;">№</th><th>ФИО ребёнка</th><th style="width:120px; text-align:right;">Сумма</th><th style="width:130px; text-align:center;">Статус</th></tr></thead><tbody>';
        students.forEach((s, i) => {
            html += '<tr><td>' + (i + 1) + '</td><td style="font-weight:500;">' + escapeHtml(s.name) + '</td><td class="amount">' + (s.amount ? formatMoney(s.amount) + ' ₽' : '—') + '</td><td style="text-align:center;"><span class="' + (s.paid ? 'status-paid' : 'status-unpaid') + '">' + (s.paid ? '✔ Сдал' : '⏳ Ожидается') + '</span></td></tr>';
        });
        html += '<tr class="totals-row"><td colspan="2"><strong>ИТОГО:</strong> сдали ' + paidCount + ' из ' + students.length + '</td><td class="amount"><strong>' + formatMoney(totalPaid) + ' ₽</strong></td><td style="text-align:center;"><small>ожидалось ' + formatMoney(totalExpected) + ' ₽</small></td></tr></tbody></table></div>';
    }
    html += '</div>';
    
    html += '<div class="section"><div class="section-title"><span class="icon">💸</span><span>Расходы месяца</span></div>';
    if (expenses.length === 0) { html += '<div style="text-align:center; padding:30px; color:rgba(255,255,255,0.5);">Расходов в этом месяце не было</div>'; }
    else {
        html += '<div style="overflow-x:auto;"><table><thead><tr><th style="width:40px;">№</th><th>На что потрачено</th><th style="width:130px; text-align:right;">Сумма</th></tr></thead><tbody>';
        expenses.forEach((e, i) => { html += '<tr><td>' + (i + 1) + '</td><td style="font-weight:500;">' + escapeHtml(e.description || '—') + '</td><td class="amount expense-amount">- ' + (e.amount ? formatMoney(e.amount) + ' ₽' : '—') + '</td></tr>'; });
        html += '<tr class="totals-row"><td colspan="2"><strong>ИТОГО РАСХОД:</strong></td><td class="amount expense-amount"><strong>- ' + formatMoney(totalExpense) + ' ₽</strong></td></tr></tbody></table></div>';
    }
    html += '</div>';
    
    const paidList = students.filter(s => s.paid);
    const unpaidList = students.filter(s => !s.paid);
    html += '<div class="lists-grid">';
    html += '<div class="list-card paid"><div class="list-title">✅ Сдали взносы <span class="list-count">' + paidList.length + '</span></div>';
    if (paidList.length === 0) html += '<div style="color:rgba(255,255,255,0.5); font-size:0.9em; text-align:center; padding:10px;">Пока никто не сдал</div>';
    else paidList.forEach(s => { html += '<div class="person"><span class="person-name">✔ ' + escapeHtml(s.name) + '</span><span class="person-amount">' + (s.amount ? formatMoney(s.amount) + ' ₽' : '') + '</span></div>'; });
    html += '</div>';
    html += '<div class="list-card unpaid"><div class="list-title">⏳ Ожидают оплаты <span class="list-count">' + unpaidList.length + '</span></div>';
    if (unpaidList.length === 0) html += '<div style="color:rgba(255,255,255,0.5); font-size:0.9em; text-align:center; padding:10px;">🎉 Все сдали! Спасибо!</div>';
    else unpaidList.forEach(s => { html += '<div class="person"><span class="person-name">⏳ ' + escapeHtml(s.name) + '</span><span class="person-amount">' + (s.amount ? formatMoney(s.amount) + ' ₽' : '') + '</span></div>'; });
    html += '</div></div>';
    
    document.getElementById('content').innerHTML = html;
}
</script>
</body>
</html>
