<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кассовый отчёт — Звездочки</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
  min-height: 100vh; 
  background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #2d1b4e 100%); 
  color: #e8e8ff; 
  padding: 20px; 
  overflow-x: hidden; 
  position: relative; 
}

/* Звёздный фон */
body::before { 
  content: ''; 
  position: fixed; 
  top: 0; left: 0; right: 0; bottom: 0; 
  background-image: 
    radial-gradient(2px 2px at 20% 30%, white, transparent),
    radial-gradient(2px 2px at 60% 70%, white, transparent),
    radial-gradient(1px 1px at 50% 50%, white, transparent),
    radial-gradient(1px 1px at 80% 10%, white, transparent),
    radial-gradient(2px 2px at 90% 60%, white, transparent),
    radial-gradient(1px 1px at 33% 80%, white, transparent);
  background-size: 200% 200%;
  animation: stars 20s linear infinite;
  opacity: 0.6;
  pointer-events: none;
  z-index: 0;
}
@keyframes stars { 0% { background-position: 0% 0%; } 100% { background-position: 200% 200%; } }

/* Экран входа */
.login-screen { 
  display: flex; align-items: center; justify-content: center; 
  min-height: 100vh; padding: 20px; position: relative; z-index: 1; 
}
.login-box { 
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 40px 30px; border-radius: 24px; max-width: 400px; width: 100%; 
  text-align: center; 
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  animation: fadeIn 0.6s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.login-box h2 { 
  color: #00e5ff; 
  margin-bottom: 10px; 
  font-size: 1.5em;
  text-shadow: 0 0 20px rgba(0, 229, 255, 0.5); 
}
.login-box p { color: rgba(255, 255, 255, 0.7); margin-bottom: 20px; font-size: 0.9em; }
.login-box input { 
  width: 100%; padding: 14px; 
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px; 
  color: white; font-size: 1em; margin-bottom: 12px; text-align: center; 
}
.login-box input::placeholder { color: rgba(255, 255, 255, 0.4); }
.login-box input:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }
.login-box button { 
  width: 100%; padding: 14px; 
  background: linear-gradient(135deg, #00e5ff, #7b61ff); 
  color: white; border: none; border-radius: 12px; 
  font-size: 1em; font-weight: 700; cursor: pointer; 
  box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4); 
}
.login-box button:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0, 229, 255, 0.6); }
.login-error { color: #ff3d71; font-size: 0.9em; margin-top: 10px; display: none; }

.container { 
  max-width: 900px; margin: 0 auto; position: relative; z-index: 1; 
}

/* Шапка */
.header { 
  text-align: center; 
  padding: 30px 20px; 
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 24px; 
  margin-bottom: 24px; 
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  animation: fadeIn 0.6s ease;
}
.header-icon { font-size: 3em; margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.5)); }
.header h1 { 
  font-size: 1.5em; font-weight: 800; 
  background: linear-gradient(135deg, #00e5ff 0%, #ff9100 100%); 
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; 
  margin-bottom: 6px; 
}
.header h2 { color: rgba(255, 255, 255, 0.85); font-size: 1.1em; font-weight: 600; margin-bottom: 4px; }
.header .subtitle { color: #ff9100; font-size: 0.9em; font-weight: 700; letter-spacing: 1px; }

.content { padding: 20px; display: flex; flex-direction: column; gap: 20px; }

/* Индикаторы бюджета */
.budget-indicators {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.indicator {
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 2px solid;
  border-radius: 16px;
  padding: 16px 12px;
  text-align: center;
  position: relative;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  animation: slideIn 0.5s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.indicator::before {
  content: '◈';
  position: absolute;
  top: 8px;
  left: 10px;
  font-size: 0.7em;
  opacity: 0.5;
}

.indicator.prev { border-color: #7b61ff; box-shadow: 0 0 20px rgba(123, 97, 255, 0.2); }
.indicator.income { border-color: #00ff88; box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }
.indicator.expense { border-color: #ff3d71; box-shadow: 0 0 20px rgba(255, 61, 113, 0.2); }
.indicator.balance { border-color: #00e5ff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); }

.indicator-label {
  font-size: 0.65em;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
  opacity: 0.8;
  font-weight: 600;
}
.indicator.prev .indicator-label { color: #7b61ff; }
.indicator.income .indicator-label { color: #00ff88; }
.indicator.expense .indicator-label { color: #ff3d71; }
.indicator.balance .indicator-label { color: #00e5ff; }

.indicator-value {
  font-size: 1.3em;
  font-weight: 800;
  font-family: 'Courier New', monospace;
  text-shadow: 0 0 10px currentColor;
}
.indicator.prev .indicator-value { color: #7b61ff; }
.indicator.income .indicator-value { color: #00ff88; }
.indicator.expense .indicator-value { color: #ff3d71; }
.indicator.balance .indicator-value { color: #00e5ff; }

/* Секция расходов */
.expenses-section { 
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 61, 113, 0.2); 
  border-left: 4px solid #ff3d71; 
  border-radius: 16px; 
  padding: 20px; 
  animation: slideIn 0.7s ease;
}
.expenses-title { 
  font-weight: 700; 
  color: #ff3d71; 
  margin-bottom: 16px; 
  display: flex; 
  align-items: center; 
  gap: 8px; 
  font-size: 1.1em;
}

.expense-module {
  background: rgba(255, 61, 113, 0.05);
  border: 1px solid rgba(255, 61, 113, 0.2);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.3s;
  position: relative;
}
.expense-module:hover {
  border-color: #ff3d71;
  box-shadow: 0 0 15px rgba(255, 61, 113, 0.3);
  transform: translateY(-2px);
}
.expense-module::before {
  content: attr(data-num);
  position: absolute;
  top: 5px;
  right: 8px;
  font-size: 0.7em;
  color: rgba(255, 61, 113, 0.5);
  font-weight: 700;
}

.module-icon {
  font-size: 1.8em;
  filter: drop-shadow(0 0 8px rgba(255, 61, 113, 0.5));
}
.module-info { flex: 1; }
.module-desc {
  font-size: 0.95em;
  color: #e8e8ff;
  margin-bottom: 4px;
  font-weight: 500;
}
.module-amount {
  font-size: 1.1em;
  color: #ff3d71;
  font-weight: 700;
  font-family: 'Courier New', monospace;
  text-shadow: 0 0 8px rgba(255, 61, 113, 0.4);
}

.expense-total {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 2px solid rgba(255, 61, 113, 0.5);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 1.2em;
  font-weight: 800;
  color: #ff3d71;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.expense-total .amount {
  font-family: 'Courier New', monospace;
  text-shadow: 0 0 15px rgba(255, 61, 113, 0.6);
}

/* Комментарий */
.comment-box { 
  background: rgba(255, 145, 0, 0.08); 
  border: 1px solid rgba(255, 145, 0, 0.3); 
  border-left: 4px solid #ff9100; 
  border-radius: 12px; 
  padding: 16px; 
  font-style: italic; 
  color: rgba(255, 255, 255, 0.9); 
  line-height: 1.5;
  animation: slideIn 0.6s ease;
}

/* Футер */
.footer { 
  text-align: center; 
  padding: 20px; 
  color: rgba(255, 255, 255, 0.4); 
  font-size: 0.8em; 
  margin-top: 20px; 
  border-top: 1px solid rgba(0, 229, 255, 0.2);
}

.no-data { text-align: center; color: rgba(255, 255, 255, 0.5); padding: 30px; font-style: italic; }

/* Кнопка печати */
.print-button { 
  position: fixed; 
  top: 20px; 
  right: 20px; 
  background: linear-gradient(135deg, #00e5ff, #7b61ff); 
  color: white; 
  border: none; 
  padding: 12px 24px; 
  border-radius: 12px; 
  font-size: 0.95em; 
  font-weight: 700; 
  cursor: pointer; 
  box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4); 
  z-index: 1000; 
  transition: all 0.3s ease; 
}
.print-button:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0, 229, 255, 0.6); }

/* Адаптив */
@media (max-width: 768px) {
  body { padding: 12px; }
  .header { padding: 20px 16px; }
  .header h1 { font-size: 1.3em; }
  .content { padding: 16px; }
  .budget-indicators { 
    grid-template-columns: repeat(2, 1fr); 
    gap: 10px;
  }
  .indicator {
    padding: 14px 10px;
  }
  .indicator-label {
    font-size: 0.6em;
  }
  .indicator-value {
    font-size: 1.15em;
  }
  .print-button { 
    top: 10px; 
    right: 10px; 
    padding: 10px 16px; 
    font-size: 0.85em; 
  }
}

@media (max-width: 380px) {
  .budget-indicators {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .indicator {
    padding: 12px 8px;
  }
  .indicator-label {
    font-size: 0.55em;
    letter-spacing: 0.5px;
  }
  .indicator-value {
    font-size: 1em;
  }
}

/* Печать — сохранение тёмного фона */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
  body { 
    background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #2d1b4e 100%) !important; 
    padding: 10mm; 
  }
  body::before { display: none; }
  .container { max-width: 100%; }
  .budget-indicators { grid-template-columns: repeat(2, 1fr) !important; }
  .indicator, .expenses-section, .comment-box, .header { 
    page-break-inside: avoid; 
  }
  .print-button { display: none; }
}
</style>
</head>
<body>

<!-- Экран входа -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <div style="font-size:3em; margin-bottom:12px;">🚀</div>
        <h2>Кассовый отчёт</h2>
        <p>Группа «Звездочки»</p>
        <input type="password" id="pwdInput" placeholder="Введите пароль" onkeypress="if(event.key==='Enter')checkPassword()">
        <button onclick="checkPassword()">🔓 Войти</button>
        <div class="login-error" id="loginError">❌ Неверный пароль</div>
    </div>
</div>

<!-- Отчёт -->
<div class="container" id="reportContainer" style="display:none;">
    <button class="print-button" onclick="window.print()">🖨️ Распечатать / PDF</button>
    
    <div class="header">
        <div class="header-icon">💵</div>
        <h1>Кассовый отчёт</h1>
        <h2 id="monthName">—</h2>
        <div class="subtitle">Группа «Звездочки»</div>
    </div>
    
    <div class="content" id="reportContent">
        <div class="no-data">Загрузка данных...</div>
    </div>
    
    <div class="footer">Родительский комитет «Звездочки» · Документ сформирован: <span id="generatedDate">—</span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyDKi0CkhA5jPr7fNkPerItkLDKNLMcLpMw",
    authDomain: "parent-budget-70c5a.firebaseapp.com",
    projectId: "parent-budget-70c5a",
    storageBucket: "parent-budget-70c5a.firebasestorage.app",
    messagingSenderId: "214835144455",
    appId: "1:214835144455:web:b1d91914f16c66004507a2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let reportData = null;
const reportId = new URLSearchParams(window.location.search).get('id');

function formatMoney(n) {
    return Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
}
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// Анимация счётчика
function animateValue(element, start, end, duration) {
    const startTime = performance.now();
    const update = (currentTime) => {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = start + (end - start) * eased;
        element.textContent = formatMoney(current) + ' ₽';
        if (progress < 1) requestAnimationFrame(update);
    };
    requestAnimationFrame(update);
}

async function loadReport() {
    if (!reportId) {
        document.body.innerHTML = '<div style="text-align:center;padding:40px;color:#ff3d71;position:relative;z-index:1;">❌ Ссылка недействительна</div>';
        return;
    }
    try {
        const doc = await db.collection('cash_reports').doc(reportId).get();
        if (!doc.exists) {
            document.body.innerHTML = '<div style="text-align:center;padding:40px;color:#ff3d71;position:relative;z-index:1;">❌ Отчёт не найден</div>';
            return;
        }
        reportData = doc.data();
        document.getElementById('loginScreen').style.display = 'flex';
    } catch(e) {
        document.body.innerHTML = '<div style="text-align:center;padding:40px;color:#ff3d71;position:relative;z-index:1;">❌ Ошибка загрузки: ' + e.message + '</div>';
    }
}

function checkPassword() {
    const pwd = document.getElementById('pwdInput').value;
    if (pwd === reportData.password) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('reportContainer').style.display = 'block';
        renderReport();
    } else {
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('pwdInput').value = '';
        document.getElementById('pwdInput').focus();
    }
}

function renderReport() {
    const r = reportData;
    document.getElementById('monthName').textContent = r.monthName || '—';
    
    const prevBal = Number(r.prevBalance || 0);
    const income = Number(r.income || 0);
    const addIncome = Number(r.additionalIncome || 0);
    const totalExpense = Number(r.totalExpense || 0);
    const balance = Number(r.balance || 0);
    
    let html = '';
    
    // Комментарий
    if (r.comment) {
        html += '<div class="comment-box">💬 ' + escapeHtml(r.comment) + '</div>';
    }
    
    // Индикаторы бюджета (сетка 2x2)
    html += '<div class="budget-indicators">';
    html += '<div class="indicator prev"><div class="indicator-label">◈ Остаток с прошл. месяца</div><div class="indicator-value" data-target="' + prevBal + '">0 ₽</div></div>';
    html += '<div class="indicator income"><div class="indicator-label">◈ Приход (взносы)</div><div class="indicator-value" data-target="' + income + '">0 ₽</div></div>';
    html += '<div class="indicator expense"><div class="indicator-label">◈ Расход</div><div class="indicator-value" data-target="' + totalExpense + '">0 ₽</div></div>';
    html += '<div class="indicator balance"><div class="indicator-label">◈ Итого баланс</div><div class="indicator-value" data-target="' + balance + '">0 ₽</div></div>';
    html += '</div>';
    
    // Расходы
    const expenses = r.expenses || [];
    html += '<div class="expenses-section">';
    html += '<div class="expenses-title">⚠ Модули расходов</div>';
    
    if (expenses.length === 0) {
        html += '<div class="no-data">⚠ Расходы не зафиксированы</div>';
    } else {
        const icons = ['🔧', '🛠️', '📦', '🎁', '🧹', '💡', '🎨', '📚', '🎭', '⚙️'];
        expenses.forEach((e, i) => {
            const icon = icons[i % icons.length];
            html += '<div class="expense-module" data-num="#' + String(i+1).padStart(2, '0') + '">';
            html += '<div class="module-icon">' + icon + '</div>';
            html += '<div class="module-info">';
            html += '<div class="module-desc">' + escapeHtml(e.description || '—') + '</div>';
            html += '<div class="module-amount">- ' + formatMoney(e.amount) + ' ₽</div>';
            html += '</div></div>';
        });
        html += '<div class="expense-total"><span>◈ ИТОГО РАСХОД:</span><span class="amount">- ' + formatMoney(totalExpense) + ' ₽</span></div>';
    }
    html += '</div>';
    
    document.getElementById('reportContent').innerHTML = html;
    
    // Запуск анимации счётчиков
    setTimeout(() => {
        document.querySelectorAll('.indicator-value').forEach(el => {
            const target = parseFloat(el.dataset.target);
            animateValue(el, 0, target, 1500);
        });
    }, 300);
    
    document.getElementById('generatedDate').textContent = new Date().toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });
}

loadReport();
</script>
</body>
</html>
