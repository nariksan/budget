<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кассовый отчёт — Звездочки</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
  min-height: 100vh; 
  background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #2d1b4e 100%); 
  color: #e8e8ff; 
  padding: 20px; 
  overflow-x: hidden; 
  position: relative; 
}
/* Звёздный фон */
body::before { 
  content: ''; 
  position: fixed; 
  top: 0; left: 0; right: 0; bottom: 0; 
  background-image: 
    radial-gradient(2px 2px at 20% 30%, white, transparent),
    radial-gradient(2px 2px at 60% 70%, white, transparent),
    radial-gradient(1px 1px at 50% 50%, white, transparent),
    radial-gradient(1px 1px at 80% 10%, white, transparent),
    radial-gradient(2px 2px at 90% 60%, white, transparent),
    radial-gradient(1px 1px at 33% 80%, white, transparent);
  background-size: 200% 200%;
  animation: stars 20s linear infinite;
  opacity: 0.6;
  pointer-events: none;
  z-index: 0;
}
@keyframes stars { 0% { background-position: 0% 0%; } 100% { background-position: 200% 200%; } }

/* Экран входа */
.login-screen { 
  display: flex; align-items: center; justify-content: center; 
  min-height: 100vh; padding: 20px; position: relative; z-index: 1; 
}
.login-box { 
  background: rgba(255, 255, 255, 0.05); 
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
  border: 1px solid rgba(255, 255, 255, 0.15); 
  padding: 40px 30px; border-radius: 24px; max-width: 400px; width: 100%; 
  text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); 
}
.login-box h2 { color: #00e5ff; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0, 229, 255, 0.5); }
.login-box p { color: rgba(255, 255, 255, 0.7); margin-bottom: 20px; }
.login-box input { 
  width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.08); 
  border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; 
  color: white; font-size: 1em; margin-bottom: 12px; text-align: center; 
}
.login-box input::placeholder { color: rgba(255, 255, 255, 0.4); }
.login-box input:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }
.login-box button { 
  width: 100%; padding: 14px; background: linear-gradient(135deg, #00e5ff, #7b61ff); 
  color: white; border: none; border-radius: 12px; font-size: 1em; font-weight: 700; 
  cursor: pointer; box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4); 
}
.login-box button:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0, 229, 255, 0.6); }
.login-error { color: #ff3d71; font-size: 0.9em; margin-top: 10px; display: none; }

/* Основной контейнер */
.container { 
  max-width: 900px; margin: 0 auto; position: relative; z-index: 1; 
  background: rgba(255, 255, 255, 0.03); 
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
  border: 1px solid rgba(255, 255, 255, 0.1); 
  border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

/* Шапка */
.header { 
  text-align: center; padding: 40px 30px; 
  background: linear-gradient(135deg, rgba(0, 229, 255, 0.1), rgba(123, 97, 255, 0.1)); 
  border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
}
.header-icon { font-size: 3.5em; margin-bottom: 12px; filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3)); }
.header h1 { 
  font-size: 2em; font-weight: 800; 
  background: linear-gradient(135deg, #00e5ff 0%, #ff9100 100%); 
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; 
  margin-bottom: 8px; 
}
.header h2 { font-size: 1.3em; color: #fff; font-weight: 600; margin-bottom: 4px; }
.header .subtitle { font-size: 1em; color: #ff9100; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

.content { padding: 30px; }

/* Секции */
.section { margin-bottom: 30px; }
.section-title { 
  font-size: 1.3em; font-weight: 700; margin-bottom: 16px; 
  display: flex; align-items: center; gap: 10px; 
  padding-bottom: 10px; border-bottom: 2px solid rgba(255, 255, 255, 0.1); 
}
.section-title.expenses { color: #ff3d71; border-color: rgba(255, 61, 113, 0.3); }
.section-title.budget { color: #00e5ff; border-color: rgba(0, 229, 255, 0.3); }

/* Комментарий */
.comment-box { 
  background: rgba(255, 145, 0, 0.1); border: 1px solid rgba(255, 145, 0, 0.3); 
  border-radius: 16px; padding: 20px; margin-bottom: 24px; position: relative; 
}
.comment-box::before { 
  content: '💬'; position: absolute; top: -15px; left: 20px; 
  font-size: 1.5em; background: #1a1a3e; padding: 0 8px; border-radius: 50%; 
}
.comment-text { color: rgba(255, 255, 255, 0.9); line-height: 1.6; font-style: italic; }

/* Список расходов */
.expense-list { 
  background: rgba(255, 61, 113, 0.05); border-radius: 16px; 
  border: 1px solid rgba(255, 61, 113, 0.2); padding: 20px; 
}
.expense-item { 
  padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
  display: flex; justify-content: space-between; align-items: center; gap: 10px; 
}
.expense-item:last-child { border-bottom: none; }
.expense-desc { font-weight: 500; color: #e8e8ff; flex: 1; }
.expense-amount { color: #ff3d71; font-weight: 700; font-size: 1.05em; font-family: 'Courier New', monospace; }
.expense-total { 
  padding-top: 15px; margin-top: 10px; border-top: 2px solid rgba(255, 61, 113, 0.5); 
  display: flex; justify-content: space-between; font-size: 1.2em; font-weight: 800; color: #ff3d71; 
}

/* Блок бюджета */
.budget-box { 
  background: rgba(0, 229, 255, 0.05); border-radius: 16px; 
  border: 1px solid rgba(0, 229, 255, 0.2); padding: 20px; 
}
.budget-row { 
  padding: 12px 0; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); 
  display: flex; justify-content: space-between; align-items: center; 
}
.budget-row:last-child { border-bottom: none; }
.budget-label { color: rgba(255, 255, 255, 0.7); }
.budget-value { font-weight: 700; font-size: 1.1em; font-family: 'Courier New', monospace; }
.budget-value.positive { color: #00e5ff; }
.budget-value.negative { color: #ff3d71; }
.budget-total { 
  padding-top: 15px; margin-top: 10px; border-top: 3px solid rgba(0, 229, 255, 0.5); 
  display: flex; justify-content: space-between; font-size: 1.3em; font-weight: 800; 
}
.budget-total .budget-value { color: #00e5ff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }

/* Футер */
.footer { 
  background: rgba(0, 0, 0, 0.2); padding: 20px 30px; text-align: center; 
  color: rgba(255, 255, 255, 0.5); font-size: 0.85em; 
  border-top: 1px solid rgba(255, 255, 255, 0.1); 
}
.footer strong { color: #00e5ff; }

/* Кнопка печати */
.print-button { 
  position: fixed; top: 20px; right: 20px; 
  background: linear-gradient(135deg, #00e5ff, #7b61ff); color: white; 
  border: none; padding: 12px 24px; border-radius: 12px; font-size: 0.95em; 
  font-weight: 700; cursor: pointer; box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4); 
  z-index: 1000; transition: all 0.3s ease; 
}
.print-button:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0, 229, 255, 0.6); }

.no-data { text-align: center; color: rgba(255, 255, 255, 0.5); padding: 30px; font-style: italic; }

/* Адаптив */
@media (max-width: 768px) { 
  body { padding: 12px; } 
  .header { padding: 24px 16px; } 
  .header h1 { font-size: 1.5em; } 
  .content { padding: 16px; } 
  .print-button { top: 10px; right: 10px; padding: 10px 16px; font-size: 0.85em; } 
}

/* ПЕЧАТЬ — Сохранение тёмного фона */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
  body { 
    background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #2d1b4e 100%) !important; 
    padding: 10mm; 
  }
  body::before { display: none; }
  .container { box-shadow: none; border: 1px solid #333; }
  .print-button { display: none; }
  .section, .expense-list, .budget-box, .comment-box { page-break-inside: avoid; }
}
</style>
</head>
<body>

<!-- Экран входа -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <div style="font-size:3em; margin-bottom:12px;">🌌</div>
        <h2>Кассовый отчёт</h2>
        <p>Группа «Звездочки»</p>
        <input type="password" id="pwdInput" placeholder="Введите пароль" onkeypress="if(event.key==='Enter')checkPassword()">
        <button onclick="checkPassword()">🔓 Войти</button>
        <div class="login-error" id="loginError">❌ Неверный пароль</div>
    </div>
</div>

<!-- Отчёт -->
<div class="container" id="reportContainer" style="display:none;">
    <button class="print-button" onclick="window.print()">🖨️ Распечатать / PDF</button>
    
    <div class="header">
        <div class="header-icon">💵</div>
        <h1>Кассовый отчёт</h1>
        <h2 id="monthName">—</h2>
        <div class="subtitle">Группа «Звездочки»</div>
    </div>
    
    <div class="content">
        <div id="commentBlock"></div>
        
        <div class="section">
            <div class="section-title expenses"><span>💸</span>Расходы</div>
            <div id="expensesBlock"></div>
        </div>
        
        <div class="section">
            <div class="section-title budget"><span>💰</span>Бюджет</div>
            <div id="budgetBlock"></div>
        </div>
    </div>
    
    <div class="footer">
        <p><strong>Родительский комитет «Звездочки»</strong></p>
        <p style="margin-top:8px;">Документ сформирован: <span id="generatedDate">—</span></p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyDKi0CkhA5jPr7fNkPerItkLDKNLMcLpMw",
    authDomain: "parent-budget-70c5a.firebaseapp.com",
    projectId: "parent-budget-70c5a",
    storageBucket: "parent-budget-70c5a.firebasestorage.app",
    messagingSenderId: "214835144455",
    appId: "1:214835144455:web:b1d91914f16c66004507a2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let reportData = null;
const reportId = new URLSearchParams(window.location.search).get('id');

function formatMoney(n) {
    return Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
}
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

async function loadReport() {
    if (!reportId) {
        document.body.innerHTML = '<div style="text-align:center;padding:40px;color:#ff3d71;position:relative;z-index:1;">❌ Ссылка недействительна</div>';
        return;
    }
    try {
        const doc = await db.collection('cash_reports').doc(reportId).get();
        if (!doc.exists) {
            document.body.innerHTML = '<div style="text-align:center;padding:40px;color:#ff3d71;position:relative;z-index:1;">❌ Отчёт не найден</div>';
            return;
        }
        reportData = doc.data();
        document.getElementById('loginScreen').style.display = 'flex';
    } catch(e) {
        document.body.innerHTML = '<div style="text-align:center;padding:40px;color:#ff3d71;position:relative;z-index:1;">❌ Ошибка загрузки: ' + e.message + '</div>';
    }
}

function checkPassword() {
    const pwd = document.getElementById('pwdInput').value;
    if (pwd === reportData.password) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('reportContainer').style.display = 'block';
        renderReport();
    } else {
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('pwdInput').value = '';
        document.getElementById('pwdInput').focus();
    }
}

function renderReport() {
    const r = reportData;
    document.getElementById('monthName').textContent = r.monthName || '—';
    
    if (r.comment) {
        document.getElementById('commentBlock').innerHTML = '<div class="comment-box"><div class="comment-text">' + escapeHtml(r.comment) + '</div></div>';
    }
    
    // 💸 РАСХОДЫ
    let expHtml = '';
    if (!r.expenses || r.expenses.length === 0) {
        expHtml = '<div class="no-data">💸 Расходов в этом месяце не было</div>';
    } else {
        expHtml = '<div class="expense-list">';
        r.expenses.forEach((e, i) => {
            expHtml += '<div class="expense-item">';
            expHtml += '<div class="expense-desc">' + (i+1) + '. ' + escapeHtml(e.description || '—') + '</div>';
            expHtml += '<div class="expense-amount">- ' + formatMoney(e.amount) + ' ₽</div>';
            expHtml += '</div>';
        });
        expHtml += '<div class="expense-total"><span>ИТОГО РАСХОД:</span><span>- ' + formatMoney(r.totalExpense) + ' ₽</span></div>';
        expHtml += '</div>';
    }
    document.getElementById('expensesBlock').innerHTML = expHtml;
    
    // 💰 БЮДЖЕТ
    let budHtml = '<div class="budget-box">';
    budHtml += '<div class="budget-row"><span class="budget-label">💰 Остаток с прошлого месяца:</span><span class="budget-value">' + formatMoney(r.prevBalance) + ' ₽</span></div>';
    budHtml += '<div class="budget-row"><span class="budget-label">📥 Приход (взносы):</span><span class="budget-value positive">+' + formatMoney(r.income) + ' ₽</span></div>';
    if (r.additionalIncome > 0) {
        budHtml += '<div class="budget-row"><span class="budget-label">💳 Дополнительный приход:</span><span class="budget-value positive">+' + formatMoney(r.additionalIncome) + ' ₽</span></div>';
    }
    budHtml += '<div class="budget-row"><span class="budget-label">💸 Расход:</span><span class="budget-value negative">-' + formatMoney(r.totalExpense) + ' ₽</span></div>';
    budHtml += '<div class="budget-total"><span>📊 ИТОГО БАЛАНС:</span><span class="budget-value">' + formatMoney(r.balance) + ' ₽</span></div>';
    budHtml += '</div>';
    document.getElementById('budgetBlock').innerHTML = budHtml;
    
    document.getElementById('generatedDate').textContent = new Date().toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });
}

loadReport();
</script>
</body>
</html>
