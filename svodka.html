<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d8b4d">
<title>Сводка группы</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<!-- ИСПРАВЛЕНО: Стабильная версия 0.10.1 + отлов ошибки загрузки -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" onerror="window.html2pdf_failed=true"></script>
<style>
:root { --success:#28a745; --danger:#dc3545; --warning:#fd7e14; --info:#17a2b8; --brand-green:#2d8b4d; --brand-orange:#e87722; --shadow-soft:0 4px 20px rgba(0,0,0,0.06); --shadow-medium:0 8px 30px rgba(0,0,0,0.1); }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:linear-gradient(135deg,#f5f7fa 0%,#e8eef5 100%); color:#333; line-height:1.6; padding:20px; min-height:100vh; }
.container { max-width:920px; margin:0 auto; background:white; border-radius:24px; box-shadow:0 20px 60px rgba(0,0,0,0.12); overflow:hidden; position:relative; }
.container::before { content:''; position:absolute; top:0; right:0; width:300px; height:300px; background:radial-gradient(circle, rgba(232,119,34,0.08) 0%, transparent 70%); pointer-events:none; z-index:0; }

/* === КНОПКИ ДЕЙСТВИЙ === */
.action-buttons { position:fixed; top:20px; right:20px; display:flex; gap:10px; z-index:1000; flex-wrap:wrap; }
.action-btn { background:white; color:var(--brand-green); border:2px solid var(--brand-green); padding:12px 20px; border-radius:12px; font-size:0.95em; font-weight:700; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,0.1); display:inline-flex; align-items:center; gap:8px; transition:all 0.3s; }
.action-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(45,139,77,0.25); }
.action-btn.pdf { background:linear-gradient(135deg, var(--brand-green), var(--brand-orange)); color:white; border-color:transparent; }
.action-btn.pdf:hover { background:linear-gradient(135deg, #236b3a, #c9611c); }
.action-btn.loading { opacity:0.7; cursor:wait; pointer-events:none; }

/* === ШАПКА === */
.header { background:linear-gradient(135deg,#2d8b4d 0%,#3fa55d 50%,#e87722 100%); color:white; padding:50px 35px 45px; text-align:center; position:relative; overflow:hidden; }
.header::before { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); animation:rotate 20s linear infinite; }
@keyframes rotate { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
.header-icon { font-size:3.5em; margin-bottom:12px; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.2)); position:relative; z-index:1; }
.header h1 { font-size:2em; margin-bottom:10px; font-weight:800; text-shadow:0 2px 8px rgba(0,0,0,0.2); position:relative; z-index:1; letter-spacing:-0.5px; }
.header h2 { font-size:1.25em; opacity:0.97; font-weight:600; position:relative; z-index:1; }
.header .subtitle { font-size:0.95em; opacity:0.9; margin-top:10px; position:relative; z-index:1; font-weight:500; letter-spacing:0.3px; }
.header .divider { width:60px; height:4px; background:rgba(255,255,255,0.5); border-radius:2px; margin:15px auto 0; position:relative; z-index:1; }

/* === КОНТЕНТ === */
.content { padding:35px; position:relative; z-index:1; }
.section { margin-bottom:35px; padding-bottom:30px; border-bottom:2px dashed #e9ecef; }
.section:last-child { border-bottom:none; }
.section-title { font-size:1.35em; font-weight:700; color:var(--brand-green); margin-bottom:18px; padding-bottom:12px; border-bottom:3px solid transparent; border-image:linear-gradient(90deg, var(--brand-orange) 0%, transparent 100%) 1; display:flex; align-items:center; gap:12px; }
.section-title.plans { color:var(--brand-orange); border-image:linear-gradient(90deg, var(--brand-green) 0%, transparent 100%) 1; }
.section-icon { font-size:1.3em; }

/* === КАРТОЧКИ СТАТИСТИКИ === */
.summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:22px; }
.summary-card { background:linear-gradient(135deg,#ffffff 0%,#f8f9fa 100%); padding:18px 16px; border-radius:14px; text-align:center; border-left:5px solid var(--brand-green); box-shadow:var(--shadow-soft); transition:transform 0.2s; }
.summary-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-medium); }
.summary-card.green { border-left-color:var(--success); background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 100%); }
.summary-card.red { border-left-color:var(--danger); background:linear-gradient(135deg,#fef2f2 0%,#fee2e2 100%); }
.summary-card.orange { border-left-color:var(--warning); background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%); }
.summary-card.blue { border-left-color:var(--info); background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%); }
.summary-label { font-size:0.72em; text-transform:uppercase; color:#666; margin-bottom:8px; font-weight:700; letter-spacing:0.5px; }
.summary-value { font-size:1.55em; font-weight:800; color:#222; letter-spacing:-0.5px; }
.summary-value.positive { color:var(--success); }
.summary-value.negative { color:var(--danger); }

/* === ТАБЛИЦЫ (ИСПРАВЛЕНО ДЛЯ PDF) === */
table { width:100%; border-collapse:separate; border-spacing:0; margin-top:16px; background:white; border-radius:12px; overflow:hidden; box-shadow:var(--shadow-soft); border:1px solid #e9ecef; table-layout:fixed; }
th { background:linear-gradient(135deg, var(--brand-green), #3fa55d); color:white; padding:13px 12px; text-align:left; font-size:0.8em; text-transform:uppercase; font-weight:700; letter-spacing:0.5px; word-wrap:break-word; }
td { padding:12px; border-top:1px solid #f0f2f5; font-size:0.92em; word-wrap:break-word; overflow-wrap:break-word; }
tbody tr { transition:background 0.15s; }
tbody tr:hover { background:#fafbfc; }
.status-paid { color:var(--success); font-weight:700; font-size:0.88em; }
.status-unpaid { color:var(--warning); font-weight:700; font-size:0.88em; }
.amount { font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.totals-row { background:linear-gradient(90deg, #fff9e6 0%, #fff3cd 100%) !important; font-weight:700; }
.totals-row td { padding:15px 12px; font-size:1em; border-top:2px solid var(--brand-orange); }
.expense-amount { color:var(--danger); font-weight:700; }

/* === БЛОКИ ИНФОРМАЦИИ === */
.comment-box { background:linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border-left:5px solid var(--warning); padding:18px 22px; border-radius:12px; margin-bottom:25px; font-style:italic; color:#78350f; box-shadow:var(--shadow-soft); }
.plans-info { background:linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border-left:5px solid var(--info); padding:18px 22px; border-radius:12px; margin-bottom:22px; color:#1e3a8a; box-shadow:var(--shadow-soft); }
.plans-info strong { color:#1e40af; }
.no-data { text-align:center; color:#9ca3af; padding:25px; font-style:italic; background:linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%); border-radius:12px; margin-top:12px; border:2px dashed #e5e7eb; }

/* === ПРОГРЕСС-БАР === */
.progress-bar { background:#e9ecef; border-radius:12px; height:28px; overflow:hidden; margin:12px 0; box-shadow:inset 0 2px 4px rgba(0,0,0,0.08); }
.progress-fill { background:linear-gradient(90deg, var(--success), var(--brand-green)); height:100%; display:flex; align-items:center; justify-content:center; color:white; font-weight:800; font-size:0.9em; transition:width 0.8s ease; box-shadow:0 2px 6px rgba(40,167,69,0.4); }

/* === СПИСКИ === */
.paid-list, .unpaid-list { padding:16px; border-radius:12px; margin-top:12px; box-shadow:var(--shadow-soft); }
.paid-list { background:linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); border-left:5px solid var(--success); }
.unpaid-list { background:linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border-left:5px solid var(--warning); }
.list-item { padding:8px 0; border-bottom:1px solid rgba(0,0,0,0.06); font-size:0.95em; }
.list-item:last-child { border-bottom:none; }

/* === ПОДВАЛ === */
.footer { background:linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); padding:25px 35px; text-align:center; color:#6c757d; font-size:0.85em; border-top:3px solid var(--brand-green); }
.footer strong { color:var(--brand-green); }
.footer p { margin:4px 0; }

/* === ЭКРАН ПАРОЛЯ === */
.password-modal { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:10000; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(8px); }
.password-box { background:white; border-radius:20px; padding:35px; max-width:420px; width:100%; box-shadow:0 25px 70px rgba(0,0,0,0.3); text-align:center; }
.password-box h2 { color:var(--brand-green); margin-bottom:12px; font-size:1.4em; }
.password-box input { width:100%; padding:14px; border:2px solid #e9ecef; border-radius:12px; font-size:1em; margin-bottom:14px; text-align:center; transition:border-color 0.2s; }
.password-box input:focus { outline:none; border-color:var(--brand-green); }
.password-box button { width:100%; padding:14px; background:linear-gradient(135deg, var(--brand-green), var(--brand-orange)); color:white; border:none; border-radius:12px; font-size:1em; font-weight:700; cursor:pointer; transition:transform 0.2s; }
.password-box button:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(45,139,77,0.3); }
.password-error { color:var(--danger); font-size:0.9em; margin-top:10px; text-align:center; display:none; }

/* === ОШИБКА === */
.error-box { text-align:center; padding:60px 20px; color:var(--danger); }
.error-icon { font-size:4em; margin-bottom:16px; }

/* === ЗАГРУЗКА === */
.loading { text-align:center; padding:60px; color:#999; }
.loading-spinner { display:inline-block; width:40px; height:40px; border:4px solid #e9ecef; border-top-color:var(--brand-green); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.login-btn { display:inline-block; margin-top:12px; padding:11px 22px; background:var(--brand-green); color:white; text-decoration:none; border-radius:10px; font-weight:600; }
.login-btn:hover { background:#236b3a; }

/* === АДАПТИВ === */
@media (max-width:600px) { 
  .header { padding:35px 20px 30px; } 
  .header h1 { font-size:1.5em; } 
  .content { padding:20px; } 
  .summary-grid { grid-template-columns:repeat(2,1fr); gap:10px; }
  .summary-value { font-size:1.3em; }
  .action-buttons { top:10px; right:10px; left:10px; justify-content:center; }
  .action-btn { padding:10px 14px; font-size:0.85em; }
  .container { border-radius:16px; }
}

/* === ПЕЧАТЬ === */
@media print { 
  body { background:white; padding:0; } 
  .container { box-shadow:none; border-radius:0; max-width:100%; }
  .action-buttons, .no-print { display:none !important; } 
  .summary-card:hover { transform:none; }
  .header { padding:30px 20px; }
  .content { padding:20px; }
  .section { page-break-inside:avoid; }
  table { page-break-inside:auto; }
  tr { page-break-inside:avoid; page-break-after:auto; }
}
</style>
</head>
<body>

<div class="action-buttons no-print" id="actionButtons" style="display:none;">
  <button class="action-btn" onclick="window.print()">🖨️ Распечатать</button>
  <button class="action-btn pdf" id="pdfBtn" onclick="downloadPDF()">📥 Скачать PDF</button>
</div>

<div id="app">
  <div class="loading"><div class="loading-spinner"></div><p style="margin-top:16px">Загрузка сводки...</p></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDKi0CkhA5jPr7fNkPerItkLDKNLMcLpMw",
  authDomain: "parent-budget-70c5a.firebaseapp.com",
  projectId: "parent-budget-70c5a",
  storageBucket: "parent-budget-70c5a.firebasestorage.app",
  messagingSenderId: "214835144455",
  appId: "1:214835144455:web:b1d91914f16c66004507a2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let reportData = null;

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatMoney(n) { return Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 }); }
function calcIncome(m) { return m.students.reduce((s, x) => s + (x.paid ? Number(x.amount || 0) : 0), 0); }
function calcExpense(m) { return m.expenses.reduce((s, x) => s + Number(x.amount || 0), 0); }

function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

async function loadReport(token) {
  try {
    const doc = await db.collection('public_reports').doc(token).get();
    if (!doc.exists) {
      showError('Ссылка недействительна', 'Эта сводка не найдена или была удалена.');
      return false;
    }
    reportData = { id: doc.id, ...doc.data() };
    if (!reportData.active) {
      showError('Ссылка отозвана', 'Эта сводка больше не доступна. Обратитесь к администратору группы.');
      return false;
    }
    return true;
  } catch(e) {
    showError('Ошибка загрузки', 'Не удалось загрузить сводку: ' + e.message);
    return false;
  }
}

function showError(title, text) {
  document.getElementById('app').innerHTML = '<div class="container"><div class="error-box"><div class="error-icon">⚠️</div><h2 style="color:#dc3545;margin-bottom:10px">' + escapeHtml(title) + '</h2><p style="color:#666">' + escapeHtml(text) + '</p><a href="index.html" class="login-btn" style="margin-top:20px">🏠 На главную</a></div></div>';
}

function showPasswordModal() {
  document.getElementById('app').innerHTML = '<div class="password-modal"><div class="password-box"><h2>🔐 Введите пароль</h2><p style="text-align:center;color:#666;margin-bottom:18px;font-size:0.9em">Для просмотра сводки нужен пароль</p><input type="password" id="pwdInput" placeholder="Пароль" onkeypress="if(event.key===\'Enter\')checkPassword()"><button onclick="checkPassword()">Войти</button><div class="password-error" id="pwdError">Неверный пароль</div><p style="text-align:center;margin-top:18px;font-size:0.8em;color:#999">Пароль должен быть в сообщении от администратора группы</p></div></div>';
  document.getElementById('pwdInput').focus();
}

async function checkPassword() {
  const input = document.getElementById('pwdInput').value;
  if (input === reportData.password) {
    renderReport();
  } else {
    document.getElementById('pwdError').style.display = 'block';
    document.getElementById('pwdInput').value = '';
  }
}

// === СКАЧИВАНИЕ PDF (ИСПРАВЛЕНО С FALLBACK) ===
function downloadPDF() {
  const btn = document.getElementById('pdfBtn');
  const element = document.getElementById('pdfContent');
  if (!element) { alert('❌ Контент не загружен'); return; }
  
  const g = reportData.groupInfo || {};
  const archiveName = reportData.archiveMonthName || '';
  const currentName = reportData.currentMonthName || '';
  const period = (archiveName && currentName) ? (archiveName + '-' + currentName) : (archiveName || currentName || 'Сводка');
  const fileName = 'Сводка_Группа' + (g.number || '') + '_' + (g.name || '').replace(/\s+/g, '_') + '_' + period.replace(/\s+/g, '_') + '.pdf';
  
  // ПРОВЕРКА: загрузилась ли библиотека (защита от блокировок CDN)
  if (typeof html2pdf === 'undefined' || window.html2pdf_failed) {
    btn.classList.add('loading');
    btn.innerHTML = '⏳ Открываю печать...';
    setTimeout(() => {
      alert('ℹ️ Библиотека PDF недоступна (возможно, блокировка сети).\n\nСейчас откроется окно печати.\n👉 Выберите в списке принтеров "Сохранить как PDF" или "Microsoft Print to PDF".');
      window.print();
      btn.classList.remove('loading');
      btn.innerHTML = '📥 Скачать PDF';
    }, 300);
    return;
  }
  
  btn.classList.add('loading');
  btn.innerHTML = '⏳ Формирую PDF...';
  
  const opt = {
    margin: [8, 6, 8, 6],
    filename: fileName,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, letterRendering: true, backgroundColor: '#ffffff', logging: false },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
  };
  
  html2pdf().from(element).set(opt).save().then(() => {
    btn.classList.remove('loading');
    btn.innerHTML = '📥 Скачать PDF';
  }).catch(err => {
    console.error(err);
    btn.classList.remove('loading');
    btn.innerHTML = '📥 Скачать PDF';
    alert('❌ Ошибка PDF: ' + err.message + '\n\nИспользуйте кнопку "Распечатать" → "Сохранить как PDF"');
  });
}

function renderReport() {
  const g = reportData.groupInfo || {};
  const archiveM = reportData.archiveMonth;
  const currentM = reportData.currentMonth;
  const generatedDate = new Date().toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });

  let html = '<div class="container" id="pdfContent">';
  
  // ШАПКА
  html += '<div class="header"><div class="header-icon">💰</div>';
  html += '<h1>' + escapeHtml(reportData.title || 'Финансовая сводка') + '</h1>';
  html += '<h2>Группа №' + escapeHtml(g.number || '') + ' «' + escapeHtml(g.name || '') + '»</h2>';
  if (reportData.archiveMonthName || reportData.currentMonthName) {
    html += '<div class="subtitle">' + escapeHtml(reportData.archiveMonthName || '') + (reportData.archiveMonthName && reportData.currentMonthName ? ' → ' : '') + escapeHtml(reportData.currentMonthName || '') + '</div>';
  }
  html += '<div class="divider"></div></div>';
  
  html += '<div class="content">';

  if (reportData.comment) {
    html += '<div class="comment-box">💬 <strong>Комментарий комитета:</strong><br>' + escapeHtml(reportData.comment).replace(/\n/g, '<br>') + '</div>';
  }

  // === АРХИВНЫЙ МЕСЯЦ (ИТОГИ) ===
  if (archiveM) {
    const aInc = calcIncome(archiveM);
    const aAi = Number(archiveM.additionalIncome || 0);
    const aExp = calcExpense(archiveM);
    const aPrev = Number(archiveM.prevBalance || 0);
    const aBal = aPrev + aInc + aAi - aExp;
    const aPc = archiveM.students.filter(s => s.paid).length;
    const aTc = archiveM.students.filter(s => s.name).length;

    html += '<div class="section"><div class="section-title"><span class="section-icon">📊</span>Итоги: ' + escapeHtml(archiveM.name) + '</div>';
    html += '<div class="summary-grid">';
    html += '<div class="summary-card blue"><div class="summary-label">Остаток с прошл. мес.</div><div class="summary-value">' + formatMoney(aPrev) + ' ₽</div></div>';
    html += '<div class="summary-card green"><div class="summary-label">Приход (взносы)</div><div class="summary-value positive">' + formatMoney(aInc) + ' ₽</div></div>';
    html += '<div class="summary-card orange"><div class="summary-label">Доп. приход</div><div class="summary-value">' + formatMoney(aAi) + ' ₽</div></div>';
    html += '<div class="summary-card red"><div class="summary-label">Расход</div><div class="summary-value negative">' + formatMoney(aExp) + ' ₽</div></div>';
    html += '<div class="summary-card green"><div class="summary-label">Итоговый остаток</div><div class="summary-value positive">' + formatMoney(aBal) + ' ₽</div></div>';
    html += '</div>';

    if (aTc > 0) {
      html += '<h3 style="color:#2d8b4d;margin:22px 0 12px;font-size:1.1em">👥 Кто сдал взносы</h3>';
      html += '<table><thead><tr><th style="width:40px">№</th><th>ФИО ребёнка</th><th style="width:110px">Сумма</th><th style="width:110px;text-align:center">Статус</th></tr></thead><tbody>';
      archiveM.students.filter(s => s.name).forEach((s, i) => {
        html += '<tr><td>' + (i+1) + '</td><td style="font-weight:500">' + escapeHtml(s.name) + '</td><td class="amount">' + (s.amount ? formatMoney(s.amount) + ' ₽' : '—') + '</td><td style="text-align:center" class="' + (s.paid ? 'status-paid' : 'status-unpaid') + '">' + (s.paid ? '✔ Оплачено' : '⏳ Ожидается') + '</td></tr>';
      });
      html += '<tr class="totals-row"><td colspan="2"><strong>ИТОГО:</strong> сдали ' + aPc + ' из ' + aTc + '</td><td class="amount"><strong>' + formatMoney(aInc) + ' ₽</strong></td><td></td></tr>';
      html += '</tbody></table>';
    }

    // 💸 РАСХОДЫ
    html += '<h3 style="color:#dc3545;margin:25px 0 12px;font-size:1.1em">💸 Расходы за период</h3>';
    if (archiveM.expenses && archiveM.expenses.length > 0) {
      html += '<table><thead><tr><th style="width:40px">№</th><th>На что потрачено</th><th style="width:120px;text-align:right">Сумма</th></tr></thead><tbody>';
      archiveM.expenses.forEach((e, i) => {
        html += '<tr><td>' + (i+1) + '</td><td>' + escapeHtml(e.description || '—') + '</td><td class="amount expense-amount">- ' + (e.amount ? formatMoney(e.amount) + ' ₽' : '—') + '</td></tr>';
      });
      html += '<tr class="totals-row"><td colspan="2"><strong>ИТОГО РАСХОД:</strong></td><td class="amount expense-amount"><strong>' + formatMoney(aExp) + ' ₽</strong></td></tr>';
      html += '</tbody></table>';
    } else {
      html += '<div class="no-data">✅ Расходов в этом периоде не было</div>';
    }
    html += '</div>';
  }

  // === ТЕКУЩИЙ МЕСЯЦ ===
  if (currentM) {
    const cInc = calcIncome(currentM);
    const cAi = Number(currentM.additionalIncome || 0);
    const cExp = calcExpense(currentM);
    const cPrev = Number(currentM.prevBalance || 0);
    const cBal = cPrev + cInc + cAi - cExp;
    const cPc = currentM.students.filter(s => s.paid).length;
    const cTc = currentM.students.filter(s => s.name).length;
    const totalExpected = currentM.students.reduce((s, x) => s + (x.name ? Number(x.amount || 0) : 0), 0);
    const remaining = totalExpected - cInc;
    const progressPercent = totalExpected > 0 ? Math.round((cInc / totalExpected) * 100) : 0;

    html += '<div class="section"><div class="section-title plans"><span class="section-icon">📋</span>' + escapeHtml(currentM.name) + '</div>';
    html += '<div class="plans-info"><strong>💡 Уважаемые родители!</strong> Ниже представлена информация о сборе взносов на текущий месяц и фактических расходах. Пожалуйста, ознакомьтесь со статусом сбора.</div>';

    // 💸 НА ЧТО БЫЛО ПОТРАЧЕНО
    html += '<h3 style="color:#dc3545;margin:22px 0 12px;font-size:1.1em">💸 На что было потрачено</h3>';
    if (currentM.expenses && currentM.expenses.length > 0) {
      html += '<table><thead><tr><th style="width:40px">№</th><th>Статья расходов</th><th style="width:120px;text-align:right">Сумма</th></tr></thead><tbody>';
      currentM.expenses.forEach((e, i) => {
        html += '<tr><td>' + (i+1) + '</td><td>' + escapeHtml(e.description || '—') + '</td><td class="amount expense-amount">- ' + (e.amount ? formatMoney(e.amount) + ' ₽' : '—') + '</td></tr>';
      });
      html += '<tr class="totals-row"><td colspan="2"><strong>ИТОГО ПОТРАЧЕНО:</strong></td><td class="amount expense-amount"><strong>' + formatMoney(cExp) + ' ₽</strong></td></tr>';
      html += '</tbody></table>';
    } else {
      html += '<div class="no-data">💸 Расходов в текущем месяце пока не было</div>';
    }

    // Прогресс сбора
    html += '<h3 style="color:#2d8b4d;margin:25px 0 12px;font-size:1.1em">📊 Прогресс сбора взносов</h3>';
    html += '<div class="summary-grid">';
    html += '<div class="summary-card blue"><div class="summary-label">Остаток с прошл. мес.</div><div class="summary-value">' + formatMoney(cPrev) + ' ₽</div></div>';
    html += '<div class="summary-card green"><div class="summary-label">Уже собрано</div><div class="summary-value positive">' + formatMoney(cInc) + ' ₽</div></div>';
    html += '<div class="summary-card orange"><div class="summary-label">Осталось собрать</div><div class="summary-value">' + formatMoney(Math.max(0, remaining)) + ' ₽</div></div>';
    html += '<div class="summary-card green"><div class="summary-label">Текущий баланс</div><div class="summary-value positive">' + formatMoney(cBal) + ' ₽</div></div>';
    html += '</div>';

    if (totalExpected > 0) {
      html += '<div class="progress-bar"><div class="progress-fill" style="width:' + progressPercent + '%">' + progressPercent + '%</div></div>';
      html += '<p style="text-align:center;color:#666;font-size:0.9em;margin-top:6px">Собрано ' + cPc + ' из ' + cTc + ' родителей</p>';
    }

    if (cTc > 0) {
      html += '<h3 style="color:#2d8b4d;margin:22px 0 12px;font-size:1.1em">👥 Сбор взносов по родителям</h3>';
      html += '<table><thead><tr><th style="width:40px">№</th><th>ФИО ребёнка</th><th style="width:110px">Сумма</th><th style="width:110px;text-align:center">Статус</th></tr></thead><tbody>';
      currentM.students.filter(s => s.name).forEach((s, i) => {
        html += '<tr><td>' + (i+1) + '</td><td style="font-weight:500">' + escapeHtml(s.name) + '</td><td class="amount">' + (s.amount ? formatMoney(s.amount) + ' ₽' : '—') + '</td><td style="text-align:center" class="' + (s.paid ? 'status-paid' : 'status-unpaid') + '">' + (s.paid ? '✔ Сдал' : '⏳ Ожидается') + '</td></tr>';
      });
      html += '<tr class="totals-row"><td colspan="2"><strong>ИТОГО:</strong> сдали ' + cPc + ' из ' + cTc + '</td><td class="amount"><strong>' + formatMoney(cInc) + ' ₽</strong></td><td></td></tr>';
      html += '</tbody></table>';
    }

    const paidList = currentM.students.filter(s => s.name && s.paid);
    const unpaidList = currentM.students.filter(s => s.name && !s.paid);

    if (reportData.showPaid !== false && paidList.length > 0) {
      html += '<div style="margin-top:22px"><h3 style="color:#28a745;margin-bottom:10px;font-size:1.05em">✅ Уже сдали (' + paidList.length + ')</h3><div class="paid-list">';
      paidList.forEach(s => { html += '<div class="list-item">✔ ' + escapeHtml(s.name) + (s.amount ? ' — ' + formatMoney(s.amount) + ' ₽' : '') + '</div>'; });
      html += '</div></div>';
    }

    if (reportData.showUnpaid !== false && unpaidList.length > 0) {
      html += '<div style="margin-top:18px"><h3 style="color:#fd7e14;margin-bottom:10px;font-size:1.05em">⏳ Ещё не сдали (' + unpaidList.length + ')</h3><div class="unpaid-list">';
      unpaidList.forEach(s => { html += '<div class="list-item">⏳ ' + escapeHtml(s.name) + (s.amount ? ' — ' + formatMoney(s.amount) + ' ₽' : '') + '</div>'; });
      html += '</div></div>';
    }

    html += '</div>';
  }

  html += '</div>';
  
  // ПОДВАЛ
  html += '<div class="footer">';
  html += '<p><strong>Родительский комитет</strong> · Группа №' + escapeHtml(g.number || '') + ' «' + escapeHtml(g.name || '') + '»</p>';
  html += '<p style="margin-top:6px">📅 Сводка сформирована: ' + generatedDate + '</p>';
  html += '<p style="margin-top:10px;font-size:0.85em;opacity:0.7">Документ можно распечатать или сохранить как PDF</p>';
  html += '</div></div>';

  document.getElementById('app').innerHTML = html;
  document.getElementById('actionButtons').style.display = 'flex';
}

async function init() {
  const token = getQueryParam('token');
  if (!token) {
    showError('Нет токена', 'Ссылка неполная. Проверьте, что скопировали её полностью.');
    return;
  }
  const loaded = await loadReport(token);
  if (!loaded) return;
  showPasswordModal();
}

init();
</script>
</body>
</html>
