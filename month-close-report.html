<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отчёт закрытия месяца</title>
<style>
    :root { --green: #2d8b4d; --orange: #e87722; --bg: #f8f9fa; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; line-height: 1.5; }
    .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
    .header { background: linear-gradient(135deg, var(--green), var(--orange)); color: white; padding: 24px; text-align: center; }
    .header h1 { margin: 0; font-size: 1.4em; }
    .header p { margin: 4px 0 0; opacity: 0.9; font-size: 0.9em; }
    .content { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    
    /* 1. Комментарий */
    .comment-block { background: #eef7ff; border-left: 4px solid #17a2b8; padding: 16px; border-radius: 8px; font-style: italic; color: #444; }
    
    /* 2. Сводка */
    .summary-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #eee; }
    .row:last-child { border-bottom: none; }
    .label { font-weight: 500; color: #666; display: flex; align-items: center; gap: 8px; }
    .value { font-weight: 700; font-size: 1.1em; }
    .val-green { color: var(--green); }
    .val-red { color: #dc3545; }
    
    /* 3. Итог */
    .total-block { background: #e8f5e9; border: 2px solid var(--green); border-radius: 16px; padding: 20px; text-align: center; }
    .total-title { font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; color: var(--green); font-weight: 700; margin-bottom: 8px; }
    .total-amount { font-size: 2.2em; font-weight: 800; color: var(--green); margin: 4px 0; }
    .total-sub { font-size: 0.85em; color: #666; }
    
    /* 4. Детализация */
    .details-block { background: #fff9e6; border-left: 4px solid var(--orange); border-radius: 8px; padding: 16px; }
    .details-title { font-weight: 700; color: #856404; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .detail-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 0.95em; }
    .detail-item:last-child { border-bottom: none; }
    
    .footer { text-align: center; padding: 20px; color: #999; font-size: 0.8em; border-top: 1px solid #eee; }
    .loading { text-align: center; padding: 40px; color: #666; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 id="reportTitle">Загрузка...</h1>
        <p id="reportGroup">Группа</p>
    </div>
    <div class="content" id="reportContent">
        <div class="loading">Загрузка данных отчёта...</div>
    </div>
    <div class="footer">Родительский комитет · Отчёт сформирован автоматически</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyDKi0CkhA5jPr7fNkPerItkLDKNLMcLpMw",
    authDomain: "parent-budget-70c5a.firebaseapp.com",
    projectId: "parent-budget-70c5a",
    storageBucket: "parent-budget-70c5a.firebasestorage.app",
    messagingSenderId: "214835144455",
    appId: "1:214835144455:web:b1d91914f16c66004507a2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function formatMoney(n) { return Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 0 }); }

async function loadReport() {
    const params = new URLSearchParams(window.location.search);
    const reportId = params.get('id');
    
    if (!reportId) {
        document.getElementById('reportContent').innerHTML = '<div class="loading">❌ Ошибка: не указан ID отчёта</div>';
        return;
    }

    try {
        const doc = await db.collection('month_close_reports').doc(reportId).get();
        if (!doc.exists) {
            document.getElementById('reportContent').innerHTML = '<div class="loading">❌ Отчёт не найден или удалён</div>';
            return;
        }
        
        const r = doc.data();
        const balance = (r.prevBalance || 0) + (r.income || 0) + (r.additionalIncome || 0) - (r.expense || 0);
        
        // Обновляем заголовок
        document.getElementById('reportTitle').textContent = r.monthName || 'Отчёт';
        document.getElementById('reportGroup').textContent = `Группа №${r.groupInfo?.number || ''} ${r.groupInfo?.name || ''}`;
        
        let html = '';
        
        // 1. КОММЕНТАРИЙ
        if (r.comment) {
            html += `<div class="comment-block">💬 ${r.comment}</div>`;
        }
        
        // 2. ФИНАНСОВАЯ СВОДКА
        html += `
        <div class="summary-card">
            <div class="row">
                <span class="label">💰 Остаток с прошлого месяца:</span>
                <span class="value">${formatMoney(r.prevBalance)} ₽</span>
            </div>
            <div class="row">
                <span class="label">📥 Приход (взносы):</span>
                <span class="value val-green">+${formatMoney(r.income)} ₽</span>
            </div>
            <div class="row">
                <span class="label">💳 Доп. приход:</span>
                <span class="value val-green">+${formatMoney(r.additionalIncome)} ₽</span>
            </div>
            <div class="row">
                <span class="label">📤 Расход:</span>
                <span class="value val-red">-${formatMoney(r.expense)} ₽</span>
            </div>
        </div>`;
        
        // 3. ИТОГОВЫЙ ПЕРЕНОС
        html += `
        <div class="total-block">
            <div class="total-title"> Переносится на следующий месяц</div>
            <div class="total-amount">${formatMoney(balance)} ₽</div>
            <div class="total-sub">Итоговый остаток</div>
        </div>`;
        
        // 4. ДЕТАЛИЗАЦИЯ РАСХОДОВ
        if (r.expenses && r.expenses.length > 0) {
            html += `<div class="details-block"><div class="details-title"> Детализация расходов</div>`;
            r.expenses.forEach(e => {
                html += `<div class="detail-item"><span>${e.description}</span><span class="val-red">-${formatMoney(e.amount)} ₽</span></div>`;
            });
            html += `</div>`;
        }
        
        document.getElementById('reportContent').innerHTML = html;
        
    } catch(e) {
        console.error(e);
        document.getElementById('reportContent').innerHTML = '<div class="loading">❌ Ошибка загрузки: ' + e.message + '</div>';
    }
}

loadReport();
</script>
</body>
</html>
