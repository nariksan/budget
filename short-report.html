<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Краткая сводка — Звездочки</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #2d1b4e 100%);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    color: #e8e8ff;
    position: relative;
    overflow-x: hidden;
}

/* Звёздный фон */
body::before { 
    content: ''; 
    position: fixed; 
    top: 0; left: 0; right: 0; bottom: 0; 
    background-image: 
        radial-gradient(2px 2px at 20% 30%, white, transparent),
        radial-gradient(2px 2px at 60% 70%, white, transparent),
        radial-gradient(1px 1px at 50% 50%, white, transparent),
        radial-gradient(1px 1px at 80% 10%, white, transparent),
        radial-gradient(2px 2px at 90% 60%, white, transparent);
    background-size: 200% 200%;
    animation: stars 20s linear infinite;
    opacity: 0.6;
    pointer-events: none;
    z-index: 0;
}
@keyframes stars { 0% { background-position: 0% 0%; } 100% { background-position: 200% 200%; } }

.container { max-width: 500px; width: 100%; position: relative; z-index: 1; }

.report {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    animation: fadeIn 0.6s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.header { text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 20px; margin-bottom: 25px; }
.header h1 { 
    font-size: 24px; font-weight: 800; 
    background: linear-gradient(135deg, #00e5ff 0%, #ff9100 100%); 
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; 
}
.header .date { color: rgba(255, 255, 255, 0.6); font-size: 14px; margin-top: 8px; letter-spacing: 0.5px; }

.row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-size: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
.row:last-of-type { border-bottom: none; }
.row .label { color: rgba(255, 255, 255, 0.8); display: flex; align-items: center; gap: 8px; }
.row .value { font-weight: 700; font-family: 'Courier New', monospace; font-size: 1.1em; text-shadow: 0 0 10px currentColor; }

.income { color: #00ff88; }
.expense { color: #ff3d71; }
.card { color: #00e5ff; }
.cash { color: #ff9100; }

.divider { border-top: 1px dashed rgba(255, 255, 255, 0.2); margin: 15px 0; }

.total { 
    display: flex; justify-content: space-between; align-items: center; 
    padding: 20px 0 10px; font-size: 22px; font-weight: 800; 
    color: #00e5ff; text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
}

.breakdown { 
    background: rgba(0, 0, 0, 0.2); 
    border: 1px solid rgba(0, 229, 255, 0.2);
    border-radius: 16px; 
    padding: 20px; 
    margin-top: 25px; 
}
.breakdown h2 { font-size: 15px; color: #00e5ff; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
.breakdown p { font-size: 14px; color: rgba(255, 255, 255, 0.8); line-height: 1.8; font-family: 'Courier New', monospace; margin-bottom: 8px; }
.breakdown p b { color: #fff; }
.breakdown .result { 
    margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(0, 229, 255, 0.2);
    font-weight: 700; color: #00ff88; font-size: 16px; text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
}

.comment-box { 
    background: rgba(255, 145, 0, 0.1); 
    border: 1px solid rgba(255, 145, 0, 0.3); 
    border-left: 4px solid #ff9100; 
    padding: 16px; 
    border-radius: 12px; 
    margin-top: 20px; 
    font-size: 14px; 
    color: rgba(255, 255, 255, 0.9); 
    font-style: italic;
    position: relative;
}
.comment-box::before {
    content: '📡';
    position: absolute;
    top: -12px;
    left: 15px;
    font-size: 1.2em;
    background: #1a1a3e;
    padding: 0 6px;
    border-radius: 50%;
}

.btn-pdf {
    width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px;
    font-weight: 700; cursor: pointer; transition: all 0.3s; margin-top: 25px;
    background: linear-gradient(135deg, #00e5ff, #7b61ff); color: #fff;
    box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
    text-transform: uppercase;
    letter-spacing: 1px;
}
.btn-pdf:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0, 229, 255, 0.5); }

.loading { text-align: center; padding: 60px 20px; color: rgba(255, 255, 255, 0.7); font-size: 18px; position: relative; z-index: 1; }
.error { text-align: center; padding: 40px 20px; background: rgba(255, 61, 113, 0.1); color: #ff3d71; border: 1px solid rgba(255, 61, 113, 0.3); border-radius: 16px; position: relative; z-index: 1; }

@media print {
    body { background: #0a0e27 !important; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body::before { display: none; }
    .btn-pdf { display: none; }
    .report { box-shadow: none; border: 1px solid rgba(255, 255, 255, 0.2); }
}
</style>
</head>
<body>
    <div class="container">
        <div id="loading" class="loading"> Загрузка данных из системы...</div>
        <div id="error" class="error" style="display:none;"></div>
        
        <div class="report" id="report" style="display:none;">
            <div class="header">
                <h1 id="out-title">📊 Краткая сводка</h1>
                <div class="date" id="date"></div>
            </div>

            <div class="row">
                <span class="label">✅ Собрано:</span>
                <span class="value income" id="out-collected">0</span>
            </div>
            <div class="row">
                <span class="label">❌ Потрачено:</span>
                <span class="value expense" id="out-spent">0</span>
            </div>
            <div class="row">
                <span class="label">💳 Доп. приход (карта):</span>
                <span class="value card" id="out-card">0</span>
            </div>
            <div class="row">
                <span class="label">💵 Доп. приход (наличные):</span>
                <span class="value cash" id="out-cash">0</span>
            </div>

            <div class="divider"></div>

            <div class="total">
                <span>ИТОГО на балансе:</span>
                <span id="out-total">0</span>
            </div>

            <div class="breakdown" id="breakdown">
                <h2>🔍 Телеметрия расчёта:</h2>
                <div id="steps"></div>
            </div>
            
            <div id="comment-box" class="comment-box" style="display:none;"></div>
            
            <button class="btn-pdf" onclick="downloadPDF()"> Скачать PDF</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDKi0CkhA5jPr7fNkPerItkLDKNLMcLpMw",
            authDomain: "parent-budget-70c5a.firebaseapp.com",
            projectId: "parent-budget-70c5a",
            storageBucket: "parent-budget-70c5a.firebasestorage.app",
            messagingSenderId: "214835144455",
            appId: "1:214835144455:web:b1d91914f16c66004507a2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const format = (n) => Number(n || 0).toLocaleString('ru-RU');
        const today = new Date();
        document.getElementById('date').textContent = 'от ' + today.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

        function loadReport() {
            const params = new URLSearchParams(window.location.search);
            const reportId = params.get('id');
            
            if (!reportId) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = '❌ Не указан ID отчёта в ссылке.';
                return;
            }

            db.collection('short_reports').doc(reportId).get().then(doc => {
                document.getElementById('loading').style.display = 'none';
                if (!doc.exists) {
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').textContent = '❌ Отчёт не найден или был удалён.';
                    return;
                }
                
                const r = doc.data();
                const collected = Number(r.collected) || 0;
                const spent = Number(r.spent) || 0;
                const card = Number(r.card) || 0;
                const cash = Number(r.cash) || 0;
                const total = collected - spent + card + cash;

                document.getElementById('out-title').textContent = '📊 ' + (r.title || 'Краткая сводка');
                document.getElementById('out-collected').textContent = format(collected) + ' ₽';
                document.getElementById('out-spent').textContent = '−' + format(spent) + ' ₽';
                document.getElementById('out-card').textContent = '+' + format(card) + ' ₽';
                document.getElementById('out-cash').textContent = '+' + format(cash) + ' ₽';
                document.getElementById('out-total').textContent = format(total) + ' ₽';

                document.getElementById('steps').innerHTML = `
                    <p>1. Взносы: <b>${format(collected)} ₽</b></p>
                    <p>2. Минус расходы: ${format(collected)} − ${format(spent)} = <b>${format(collected - spent)} ₽</b></p>
                    <p>3. Плюс карта: ${format(collected - spent)} + ${format(card)} = <b>${format(collected - spent + card)} ₽</b></p>
                    <p>4. Плюс наличные: ${format(collected - spent + card)} + ${format(cash)} = <b>${format(total)} ₽</b></p>
                    <p class="result">💡 Итоговый баланс: ${format(total)} ₽</p>
                `;

                if (r.comment) {
                    document.getElementById('comment-box').style.display = 'block';
                    document.getElementById('comment-box').textContent = r.comment;
                }

                document.getElementById('report').style.display = 'block';
            }).catch(err => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = '❌ Ошибка загрузки: ' + err.message;
            });
        }

        function downloadPDF() {
            const element = document.getElementById('report');
            const title = document.getElementById('out-title').textContent.replace(/[^a-zа-яё0-9]/gi, '_');
            
            const opt = {
                margin: 15,
                filename: `Сводка_${title}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                // Устанавливаем тёмный фон, чтобы PDF соответствовал экрану
                html2canvas: { scale: 2, backgroundColor: '#0a0e27', useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }

        loadReport();
    </script>
</body>
</html>
